<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carteles · ¡Encerrados en el museo!</title>
<style>
@page { size: letter portrait; margin: 0.5in; }
*{box-sizing:border-box}
body{margin:0;background:#eee;color:#000;font-family:Georgia,'Times New Roman',serif}
.bar{position:sticky;top:0;background:#1b2740;color:#fff;font-family:system-ui,sans-serif;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
.bar button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 16px;background:#f29f05;cursor:pointer}
.bar span{flex:1;min-width:240px;font-size:.95rem}
.page{width:8.5in;min-height:11in;margin:18px auto;background:#fff;padding:0.5in;box-shadow:0 4px 18px #0003;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.head{border-bottom:1.5px solid #000;padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.head h1{margin:0;font-size:30pt;line-height:1.05}
.head .k{font-family:system-ui,sans-serif;font-size:10pt;letter-spacing:.12em;text-transform:uppercase;text-align:right}
.lead{font-size:15pt;margin:0 0 16px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid #000;border-radius:10px;padding:12px 14px}
.box h2{margin:0 0 6px;font-size:15pt;font-family:system-ui,sans-serif}
.box p{margin:0;font-size:13.5pt;line-height:1.42}
.names{margin-top:16px;border:1px dashed #000;border-radius:10px;padding:10px 14px;font-size:14pt;line-height:1.7;text-align:center}
.names b{font-family:system-ui,sans-serif;display:block;font-size:11pt;letter-spacing:.1em;text-transform:uppercase}
.obj{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.obj .box{display:flex;gap:12px;align-items:center}
.num{width:52px;height:52px;flex:none;border:1.5px solid #000;border-radius:50%;display:grid;place-items:center;font-size:24pt;font-weight:700}
.obj b{font-size:15pt;display:block}
.obj span{font-size:12.5pt}
.extra{margin-top:14px;display:grid;gap:10px}
.foot{margin-top:18px;font-family:system-ui,sans-serif;font-size:9pt;text-align:center}
@media print{ body{background:#fff} .bar{display:none} .page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:0} }
</style>
</head>
<body>
<div class="bar"><button onclick="print()">🖨 Imprimir los 3 carteles</button><span>Una copia de cada cartel. Pégalos en tres lugares del salón: los equipos caminan hasta el cartel para leerlo. Las respuestas NO están en los carteles.</span></div>
<div id="out"></div>
<script src="escape-contenido.js"></script>
<script>
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const C = window.ESCAPE_CARTELES, T = window.ESCAPE.title;
const head = (c, n) => `<div class="head"><h1>${h(c.title.replace(/^CARTEL \d+ · /, ''))}</h1><div class="k">${h(T)}<br><b style="font-size:20pt;letter-spacing:.04em">CARTEL ${n}</b></div></div><p class="lead">${h(c.lead)}</p>`;
let html = '';
html += `<section class="page">${head(C[1], 1)}<div class="grid">${C[1].items.map(([t, p]) => `<div class="box"><h2>✉ ${h(t)}</h2><p>${h(p)}</p></div>`).join('')}</div><div class="foot">Sala de los Países</div></section>`;
html += `<section class="page">${head(C[2], 2)}<div class="grid">${C[2].items.map(([t, p]) => `<div class="box"><h2>${h(t)}</h2><p>${h(p)}</p></div>`).join('')}</div>
  <div class="names"><b>Nombres</b>${C[2].names.map(h).join(' · ')}</div><div class="foot">Sala de las Personas Especiales</div></section>`;
html += `<section class="page">${head(C[3], 3)}<div class="obj">${C[3].objects.map(([n, t, d]) => `<div class="box"><div class="num">${n}</div><div><b>${h(t)}</b><span>${h(d)}</span></div></div>`).join('')}</div>
  <div class="extra">${C[3].extra.map(([t, p]) => `<div class="box"><h2>${h(t)}</h2><p>${h(p)}</p></div>`).join('')}</div><div class="foot">Sala del Altar</div></section>`;
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
