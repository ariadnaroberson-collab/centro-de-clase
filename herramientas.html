<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas de Clase</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Schoolbell&display=swap');

  :root {
    --bg: #2c4a3e;
    --bg-dark: #1a2e25;
    --card: #f7f4ef;
    --card-2: #ece6da;
    --chalk: #e8e4d9;
    --gold: #f5c842;
    --red: #e84545;
    --blue: #4a90d9;
    --green: #7fae6f;
    --text-dark: #2c2c2c;
    --text-mid: #5a5a5a;
    --dash: rgba(255,255,255,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-dark);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.025), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.02), transparent 45%);
    color: var(--chalk);
    min-height: 100vh;
  }
  button, select, input, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 2px dashed var(--dash);
    position: sticky; top: 0; z-index: 30; background: var(--bg-dark);
  }
  .home-link {
    color: var(--chalk); text-decoration: none; font-family: 'Schoolbell', cursive;
    border: 1.5px dashed rgba(232,228,217,0.4); padding: 6px 12px; border-radius: 14px; font-size: 0.95rem;
  }
  .home-link:hover { border-color: var(--gold); color: var(--gold); }
  .brand { font-family: 'Caveat', cursive; font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .brand small { font-family: 'Schoolbell', cursive; font-size: 0.8rem; color: var(--gold); letter-spacing: 2px; display: block; }
  .spacer { flex: 1; }
  .class-pick { display: flex; align-items: center; gap: 8px; font-family: 'Schoolbell', cursive; }
  .class-pick select {
    background: var(--gold); color: var(--bg-dark); border: none; border-radius: 14px;
    padding: 8px 14px; font-weight: 800; font-family: 'Nunito', sans-serif; font-size: 1rem;
  }
  .tb-btn {
    background: transparent; color: var(--chalk); border: 1.5px solid rgba(232,228,217,0.45);
    border-radius: 14px; padding: 7px 13px; font-weight: 700; font-size: 0.92rem;
  }
  .tb-btn:hover { border-color: var(--gold); color: var(--gold); }
  .tb-btn.gold { background: var(--gold); color: var(--bg-dark); border-color: var(--gold); }
  #timerPill {
    display: none; background: var(--red); color: #fff; border: none; border-radius: 14px;
    padding: 7px 13px; font-weight: 800; font-variant-numeric: tabular-nums;
  }

  /* ---------- LAYOUT ---------- */
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 66px); }
  nav.side { border-right: 2px dashed var(--dash); padding: 16px 12px 30px; overflow-y: auto; max-height: calc(100vh - 66px); position: sticky; top: 66px; }
  .sec-title {
    font-family: 'Schoolbell', cursive; color: var(--gold); font-size: 0.85rem; letter-spacing: 2px;
    text-transform: uppercase; margin: 16px 8px 6px;
  }
  .sec-title:first-child { margin-top: 0; }
  .nav-btn {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--chalk); padding: 7px 10px; border-radius: 10px;
    font-size: 0.95rem; font-weight: 700; line-height: 1.15;
  }
  .nav-btn .ic { font-size: 1.2rem; width: 26px; text-align: center; flex-shrink: 0; }
  .nav-btn .en { display: block; font-weight: 400; font-size: 0.72rem; opacity: 0.55; }
  .nav-btn:hover { background: rgba(255,255,255,0.07); }
  .nav-btn.on { background: var(--card); color: var(--bg-dark); }
  .nav-btn.on .en { opacity: 0.7; }
  .backup { margin: 22px 8px 0; display: flex; flex-direction: column; gap: 6px; }
  .backup p { font-size: 0.72rem; opacity: 0.55; line-height: 1.35; }

  main { padding: 22px 26px 50px; min-width: 0; }
  .panel {
    background: var(--card); color: var(--text-dark); border-radius: 18px; padding: 24px 28px 30px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.22), 0 12px 22px rgba(0,0,0,0.22); min-height: 70vh;
  }
  .p-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .p-head h2 { font-family: 'Caveat', cursive; font-size: 2.6rem; color: var(--bg); line-height: 1; }
  .p-head .cls { font-family: 'Schoolbell', cursive; background: var(--bg); color: var(--chalk); border-radius: 12px; padding: 3px 12px; font-size: 0.9rem; }
  .hint { color: var(--text-mid); font-size: 0.92rem; margin-bottom: 18px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    nav.side { position: static; max-height: none; border-right: none; border-bottom: 2px dashed var(--dash);
      display: flex; overflow-x: auto; gap: 4px; padding: 10px; }
    .sec-title, .backup { display: none; }
    .nav-btn { width: auto; white-space: nowrap; }
    .nav-btn .en { display: none; }
    main { padding: 16px; }
    .panel { padding: 18px 16px 24px; }
  }

  /* ---------- SHARED UI ---------- */
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .center { text-align: center; }
  .btn {
    background: var(--bg); color: var(--chalk); border: none; border-radius: 14px; padding: 10px 18px;
    font-weight: 800; font-size: 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.25); transition: transform .08s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .btn.gold { background: var(--gold); color: var(--bg-dark); }
  .btn.red { background: var(--red); color: #fff; }
  .btn.ghost { background: transparent; color: var(--bg); border: 2px solid var(--bg); box-shadow: none; }
  .btn.sm { padding: 6px 11px; font-size: 0.88rem; border-radius: 10px; }
  .btn.xl { font-size: 1.35rem; padding: 14px 30px; border-radius: 18px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .field { border: 2px solid #d8d0c0; border-radius: 10px; padding: 7px 10px; background: #fff; color: var(--text-dark); }
  label.chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--text-mid); }
  textarea.field { width: 100%; min-height: 110px; resize: vertical; line-height: 1.4; }

  .big {
    font-family: 'Caveat', cursive; font-weight: 700; color: var(--bg);
    font-size: clamp(3rem, 8vw, 6.5rem); line-height: 1.05; text-align: center; word-break: break-word;
  }
  .reveal {
    background: #fff; border: 3px dashed #d8d0c0; border-radius: 20px; padding: 30px 20px; margin: 18px 0;
    min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .reveal .sub { font-size: 1.25rem; color: var(--text-mid); text-align: center; }
  .reveal .frame { font-family: 'Schoolbell', cursive; font-size: 1.4rem; color: var(--bg); text-align: center; }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: scale(1); opacity: 1 } }
  .muted { color: var(--text-mid); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--card-2); border-radius: 10px; padding: 4px 10px; font-size: 0.88rem; font-weight: 700; }
  .chip.done { opacity: 0.35; text-decoration: line-through; }

  /* student card grid */
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .scard {
    background: #fff; border: 2px solid #e1d9c9; border-radius: 14px; padding: 12px; position: relative;
    display: flex; flex-direction: column; gap: 6px; user-select: none;
  }
  .scard.click { cursor: pointer; }
  .scard.click:hover { border-color: var(--gold); }
  .scard .nm { font-weight: 800; font-size: 1.05rem; }
  .scard .val { font-family: 'Caveat', cursive; font-size: 2.3rem; font-weight: 700; color: var(--bg); line-height: 1; }
  .scard .mini { display: flex; gap: 5px; flex-wrap: wrap; }
  .scard.zero { border-style: dashed; border-color: var(--red); }
  .scard.flash { animation: flash .6s ease; }
  @keyframes flash { 0%,100% { background: #fff } 40% { background: #fff2bf } }

  /* groups */
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
  .gcard { background: #fff; border-radius: 16px; padding: 14px 16px; border-top: 8px solid var(--gold); box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  .gcard h3 { font-family: 'Caveat', cursive; font-size: 1.9rem; color: var(--bg); line-height: 1; margin-bottom: 6px; }
  .gcard li { list-style: none; font-weight: 700; font-size: 1.15rem; padding: 2px 0; }

  /* timers */
  /* ---------- ROTACIÓN DE CLASE ---------- */
  .rt-top { margin-bottom: 12px; }
  .rt-lbl { font-weight: 800; color: var(--bg); }
  .rt-stage { background: #fff; border: 3px solid #e1d9c9; border-radius: 18px; padding: 16px 20px; }
  .rt-stage.fin { border-color: var(--red); }
  .rt-step { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-mid); font-weight: 700; }
  .rt-phase { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(2rem, 4.5vw, 3.2rem); color: var(--bg); line-height: 1.05; }
  .rt-clock { font-size: clamp(5rem, 15vw, 10rem); }
  .rt-clock.low { color: var(--red); }
  .rt-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 700px) { .rt-groups { grid-template-columns: 1fr; } }
  .rt-g { background: #fff; border-radius: 16px; padding: 12px 16px; border: 3px solid #e1d9c9; border-top-width: 10px; min-width: 0; }
  .rt-g.teacher { border-top-color: var(--green); } .rt-g.solo { border-top-color: var(--gold); } .rt-g.together { border-top-color: var(--blue); }
  .rt-gn { font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.1rem; color: var(--bg); line-height: 1; }
  .rt-chip { display: inline-block; font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 10px; border-radius: 99px; background: var(--card-2); color: var(--bg-dark); margin: 6px 0; }
  .rt-g.teacher .rt-chip { background: var(--green); color: #fff; } .rt-g.solo .rt-chip { background: var(--gold); } .rt-g.together .rt-chip { background: var(--blue); color: #fff; }
  .rt-task { font-size: clamp(1.05rem, 1.8vw, 1.4rem); line-height: 1.35; color: var(--text-dark); border-radius: 8px; padding: 2px 4px; outline: 2px dashed transparent; cursor: text; }
  .rt-task:hover { outline-color: #e1d9c9; } .rt-task:focus { outline: 2px solid var(--gold); }
  .rt-tl { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
  .rt-seg { min-width: 72px; background: #fff; border: 2px solid #e1d9c9; border-radius: 10px; padding: 5px 7px; font-size: .78rem; color: var(--text-mid); overflow-wrap: anywhere; }
  .rt-seg b { display: block; color: var(--bg); font-variant-numeric: tabular-nums; }
  .rt-seg.now { border-color: var(--bg); box-shadow: inset 0 -4px 0 var(--gold); } .rt-seg.done { opacity: .45; }
  .rt-edit label { font-weight: 700; color: var(--bg); }
  .rt-etable { overflow-x: auto; margin: 12px 0; } .rt-etable > div { min-width: 900px; }
  .rt-er { display: grid; grid-template-columns: 2fr 64px 1.1fr 2fr 1.1fr 2fr 44px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .rt-er.head { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); font-weight: 800; }
  .rt-er .field { min-width: 0; width: 100%; }
  .tgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 8px; }
  .tcard { background: #fff; border-radius: 18px; padding: 16px 18px; border: 3px solid #e1d9c9; position: relative; }
  .tcard.run { border-color: var(--green); }
  .tcard.done { border-color: var(--red); animation: alarm 1s infinite; }
  @keyframes alarm { 0%,100% { background: #fff } 50% { background: #ffd9d9 } }
  .tcard input.lbl { border: none; border-bottom: 2px dashed #d8d0c0; font-weight: 800; font-size: 1.1rem; width: 75%; background: transparent; color: var(--bg); }
  .tcard .x { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 1.2rem; color: var(--text-mid); }
  .tdisp { font-family: 'Nunito', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; color: var(--bg); line-height: 1.1; margin: 8px 0; }
  .tbar { height: 12px; background: var(--card-2); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .tbar div { height: 100%; background: var(--green); transition: width .2s linear; }
  .tcard.done .tbar div { background: var(--red); }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 10px; }

  /* wheel */
  .wheel-wrap { position: relative; width: min(520px, 86vw); margin: 10px auto 0; }
  .wheel-wrap canvas { width: 100%; height: auto; display: block; cursor: pointer; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 38px solid var(--red);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); z-index: 2; }
  .wheel-layout { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .wheel-layout { grid-template-columns: 1fr; } }
  .side-box { background: var(--card-2); border-radius: 14px; padding: 14px; }
  .side-box h4 { font-family: 'Schoolbell', cursive; color: var(--bg); margin-bottom: 6px; }

  /* overlay winner */
  #overlay { position: fixed; inset: 0; background: rgba(26,46,37,0.88); display: none; z-index: 100;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 20px; }
  #overlay.show { display: flex; }
  #overlay .ov-card { background: var(--card); border-radius: 24px; padding: 30px 46px; text-align: center; max-width: 92vw; }
  #overlay .ov-sm { font-family: 'Schoolbell', cursive; color: var(--text-mid); font-size: 1.3rem; }

  /* seats */
  .board-front { background: var(--bg); color: var(--chalk); text-align: center; border-radius: 10px; padding: 8px; font-family: 'Schoolbell', cursive; margin: 14px 0; }
  .seats { display: grid; gap: 10px; }
  .seat { background: #fff; border: 2px solid #d8d0c0; border-radius: 10px; padding: 14px 6px; text-align: center; font-weight: 800; cursor: pointer; min-height: 56px; display: flex; align-items: center; justify-content: center; }
  .seat.sel { border-color: var(--red); background: #ffecec; }
  .seat.empty { border-style: dashed; color: #bbb; font-weight: 400; cursor: default; }

  /* noise meter */
  .meter { height: 70px; background: var(--card-2); border-radius: 35px; overflow: hidden; position: relative; margin: 18px 0 8px; }
  .meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--gold) 60%, var(--red)); transition: width .1s linear; }
  .meter .thr { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--bg-dark); }
  .voice-levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
  @media (max-width: 700px) { .voice-levels { grid-template-columns: repeat(2, 1fr); } }
  .vl { background: #fff; border: 3px solid #e1d9c9; border-radius: 16px; padding: 14px 8px; text-align: center; cursor: pointer; }
  .vl .e { font-size: 2.6rem; }
  .vl .t { font-weight: 800; }
  .vl.on { border-color: var(--bg); background: #e6f0ea; }

  /* points */
  .progress { height: 34px; background: var(--card-2); border-radius: 17px; overflow: hidden; margin: 10px 0; }
  .progress div { height: 100%; background: var(--green); border-radius: 17px; transition: width .4s; }
  .house { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; background: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; }
  .house .em { font-size: 2.6rem; text-align: center; }
  .house .hn { font-family: 'Caveat', cursive; font-size: 1.8rem; font-weight: 700; color: var(--bg); line-height: 1; cursor: pointer; }
  .house .hb { height: 18px; background: var(--card-2); border-radius: 9px; overflow: hidden; margin-top: 6px; }
  .house .hb div { height: 100%; background: var(--gold); transition: width .4s; }
  .house .hp { font-family: 'Caveat', cursive; font-size: 2.6rem; font-weight: 700; min-width: 70px; text-align: right; color: var(--bg); }
  .house .members { font-size: 0.85rem; color: var(--text-mid); margin-top: 4px; }
  .house.lead { outline: 3px solid var(--gold); }

  /* cubes */
  .cubes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin: 20px 0; }
  .cube { width: 120px; height: 120px; background: #fff; border-radius: 22px; border: 3px solid #d8d0c0; display: flex; align-items: center; justify-content: center; font-size: 4rem; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .cube.roll { animation: shake .12s infinite; }
  @keyframes shake { 0% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } 100% { transform: rotate(-8deg) } }

  /* generator rows */
  .gen-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; background: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  .gen-row .gl { font-family: 'Schoolbell', cursive; color: var(--text-mid); }
  .gen-row .gv { font-family: 'Caveat', cursive; font-size: 2.1rem; font-weight: 700; color: var(--bg); line-height: 1.1; }
  @media (max-width: 640px) { .gen-row { grid-template-columns: 1fr auto; } .gen-row .gl { grid-column: 1 / -1; } }
  .story-out { background: var(--bg); color: var(--chalk); border-radius: 16px; padding: 18px 22px; font-size: 1.35rem; line-height: 1.5; margin-top: 14px; }

  /* verb card */
  .verb-forms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 640px; }
  .verb-forms div { background: var(--card-2); border-radius: 12px; padding: 10px; text-align: center; }
  .verb-forms b { display: block; font-family: 'Schoolbell', cursive; font-weight: 400; color: var(--text-mid); font-size: 0.85rem; }
  .verb-forms span { font-size: 1.5rem; font-weight: 800; color: var(--bg); }

  /* stickers */
  .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .palette button { font-size: 1.8rem; background: #fff; border: 3px solid transparent; border-radius: 12px; width: 52px; height: 52px; }
  .palette button.on { border-color: var(--bg); background: #e6f0ea; }
  .stk { font-size: 1.5rem; line-height: 1.2; min-height: 30px; word-break: break-all; }

  /* modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 90; align-items: center; justify-content: center; padding: 20px; }
  #modal.show { display: flex; }
  #modal .m-card { background: var(--card); color: var(--text-dark); border-radius: 18px; padding: 22px 24px; width: min(520px, 100%); max-height: 85vh; overflow-y: auto; }
  #modal h3 { font-family: 'Caveat', cursive; font-size: 2rem; color: var(--bg); }
  .abs-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--bg-dark);
    font-weight: 800; padding: 10px 20px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.3); display: none; z-index: 120; }
  .confetti { position: fixed; top: -40px; font-size: 2rem; z-index: 110; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  /* ---------- SAFARI SILENCIOSO ---------- */
  .hab-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .hab-pick button { background: #fff; border: 3px solid #e1d9c9; border-radius: 14px; padding: 8px 12px; font-weight: 800; color: var(--bg); }
  .hab-pick button.on { border-color: var(--bg); background: #e6f0ea; }
  .hab-pick button:disabled { opacity: .5; cursor: default; }
  .saf-wrap { position: relative; }
  .saf-wrap.full { position: fixed; inset: 0; z-index: 80; background: #0d1813; display: flex; align-items: center; justify-content: center; }
  .scene { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; container-type: inline-size; background: #2f6b3a; user-select: none; }
  .saf-wrap.full .scene { width: min(100vw, 177.78vh); border-radius: 0; }
  .scene svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .animal { position: absolute; transform: translate(-50%, -50%); text-align: center; cursor: pointer; z-index: 5; line-height: 1; }
  .scene .animal .em { display: block; font-size: calc(6.2cqw * var(--s, 1)); filter: drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.35)); animation: bob 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .scene .animal.flip .em { transform: scaleX(-1); }

  .en-pill.warn { background: #fff1c2; } .en-pill.ok { background: #dff3e4; }
  .en-lv { display: inline-flex; gap: 6px; margin-left: auto; }
  .en-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .en-tab { border: 2px solid #d6e3d6; background: #f7faf6; border-radius: 12px; padding: 6px 12px; font-weight: 800; cursor: pointer; font-size: 1rem; }
  .en-tab.on { border-color: #e09f1f; background: #fff3cf; }
  .en-tab.add { border-style: dashed; }
  .en-ed { background: #fbfdf9; border: 2px solid #e4ede2; border-radius: 14px; padding: 14px; }
  .en-ed h3 { margin: 0 0 8px; }
  .en-l { display: block; font-weight: 800; margin: 12px 0 4px; }
  .en-w { width: 100%; resize: vertical; font: inherit; }
  .en-q { background: #fff; border: 2px solid #e6ece4; border-radius: 12px; padding: 10px; margin: 8px 0; }
  .en-n { width: 26px; height: 26px; border-radius: 8px; background: #0f3d2e; color: #f2c14e; display: grid; place-items: center; flex: none; }
  .en-opts { display: grid; gap: 6px; margin-top: 8px; }
  .en-k2 { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; padding: 8px; background: #f2f6fd; border-radius: 10px; font-weight: 800; font-size: .88rem; }
  .en-k2 label { display: flex; flex-direction: column; gap: 3px; }
  .en-opt { display: flex; gap: 8px; align-items: center; border-radius: 10px; padding: 2px 6px; }
  .en-opt.ok { background: #dff3e4; } .en-opt .field { flex: 1; }
  .en-opt input[type=radio] { width: 20px; height: 20px; accent-color: #2e9e5b; flex: none; }
  .en-bank { background: #fffaf0; border: 2px dashed #e09f1f; border-radius: 12px; padding: 10px; margin-top: 10px; max-height: 360px; overflow: auto; }
  .en-bq { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #f0e4c8; padding: 8px 0; }
  .en-pub { margin-top: 14px; }
  .en-bigqr { position: fixed; inset: 0; z-index: 9999; background: #fff; color: #0f3d2e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .en-bigqr svg { width: min(62vh, 80vw); height: min(62vh, 80vw); }
  .en-tab.off { opacity: .45; text-decoration: line-through; }
  .sp-pick { margin-bottom: 10px; }
  .sp-ed { background: #fff; color: #1d2b24; border-radius: 18px; padding: 16px; }
  .sp-edl { margin: 6px 0; gap: 6px; }

let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, vol = 0.15, type = 'sine', when = 0) {
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

class Wheel {
  constructor(canvas, items, onDone) { this.cv = canvas; this.items = items; this.onDone = onDone; this.rot = 0; this.spinning = false; this.draw(); }
  setItems(items) { this.items = items; this.draw(); }
  draw() {
    const c = this.cv, x = c.getContext('2d'), W = c.width, cx = W / 2, r = W / 2 - 10, n = this.items.length;
    x.clearRect(0, 0, W, W);
    if (!n) {
      x.beginPath(); x.arc(cx, cx, r, 0, Math.PI * 2); x.fillStyle = '#ece6da'; x.fill();
      x.fillStyle = '#5a5a5a'; x.font = '700 28px Nunito'; x.textAlign = 'center'; x.fillText('¡Sin elementos!', cx, cx + 10); return;
    }
    const seg = Math.PI * 2 / n;
    const fs = Math.max(14, Math.min(34, Math.floor(560 / Math.max(n, 6))));
    for (let i = 0; i < n; i++) {
      const a0 = this.rot + i * seg;
      x.beginPath(); x.moveTo(cx, cx); x.arc(cx, cx, r, a0, a0 + seg); x.closePath();
      x.fillStyle = WHEEL_COLORS[(n % WHEEL_COLORS.length === 1 && i === n - 1) ? 2 : i % WHEEL_COLORS.length];
      x.fill(); x.strokeStyle = '#1a2e25'; x.lineWidth = 3; x.stroke();
      x.save(); x.translate(cx, cx); x.rotate(a0 + seg / 2); x.textAlign = 'right';
      x.fillStyle = '#1a2e25'; x.font = '800 ' + fs + 'px Nunito';
      let label = String(this.items[i]); if (label.length > 20) label = label.slice(0, 19) + '…';
      x.fillText(label, r - 18, fs / 3); x.restore();
    }
    x.beginPath(); x.arc(cx, cx, 34, 0, Math.PI * 2); x.fillStyle = '#1a2e25'; x.fill();
    x.beginPath(); x.arc(cx, cx, 26, 0, Math.PI * 2); x.fillStyle = '#f5c842'; x.fill();
  }
  idxAt(rot) { const n = this.items.length, seg = Math.PI * 2 / n, TAU = Math.PI * 2; const rel = (((-Math.PI / 2 - rot) % TAU) + TAU) % TAU; return Math.floor(rel / seg) % n; }
  spin() {
    const n = this.items.length; if (this.spinning || !n) return;
    ac();
    const TAU = Math.PI * 2, seg = TAU / n, w = rnd(n);
    const desired = -Math.PI / 2 - (w * seg + seg * (0.2 + 0.6 * Math.random()));
    const cur = this.rot, diff = (((desired - cur) % TAU) + TAU) % TAU;
    const target = cur + TAU * (5 + rnd(3)) + diff, dur = 4200 + rnd(1200), start = performance.now();
    let last = this.idxAt(cur); this.spinning = true;
    const frame = now => {
      const t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 4);
      this.rot = cur + (target - cur) * e;
      const idx = this.idxAt(this.rot); if (idx !== last) { last = idx; tick(); }
      this.draw();
      if (t < 1 && this.cv.isConnected) requestAnimationFrame(frame);
      else { this.rot = target; this.spinning = false; this.draw(); if (this.cv.isConnected) this.onDone(this.items[w], w); }
    };
    requestAnimationFrame(frame);

}

    else if (ROT.active) rotLoad(n, t.running); else { ROT.idx = n; }
    render(); };
  $$('#rtPlus').onclick = () => { if (!ROT.active) rotLoad(ROT.idx, false);
    if (t.running) t.endAt += 60000; else t.remaining += 60; t.total = Math.max(t.total, tRemain(t)); if (tRemain(t) > 60) ROT.warned = false; rotPaint(); };
  $$('#rtReset').onclick = () => { rotStop(); ROT.idx = 0; ROT.fin = false; render(); };
  $$('#rtTest').onclick = () => { ac(); alarm(); };
  el.querySelectorAll('.rt-task').forEach(d => {
    d.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.blur(); } e.stopPropagation(); };
    d.onblur = () => { const p = P.phases[ROT.idx]; if (!p) return; p[d.dataset.k] = d.textContent.trim(); rotSave(); };
  });
});

tool('safari', 'manage', '🐾', 'Safari silencioso', 'Quiet-work game (shy animals)', 'Los animales salen solo cuando la clase trabaja en silencio. Si hay mucho ruido, el último animal se esconde otra vez. Toca un animal para leer sobre él (el juego se pausa).', el => {
  const g = gdata();
  const o = Object.assign({ hab: 'selva', count: 0, mins: 10, sens: 5, thr: 55, labels: true, mic: true, pts: 5 }, g.safari || {});
  const persist = () => { g.safari = o; save(); };
  const st = { state: 'idle', queue: [], shown: [], pos: new Map(), prog: 0, per: 60, over: 0, cool: 0, level: 0, ignoreUntil: 0, msgUntil: 0, stream: null, an: null, buf: null, iv: 0, total: 0, factOpen: false };
  const H = () => HABITATS[o.hab];
  const nameCap = a => capFirst(a[1]);

  el.innerHTML += `
    <div class="hab-pick" id="habPick">${Object.entries(HABITATS).map(([k, v]) => `<button data-h="${k}" class="${k === o.hab ? 'on' : ''}">${v.e} ${v.t}</button>`).join('')}</div>
    <div class="saf-wrap" id="sWrap"><div class="scene" id="scene"></div></div>
    <div class="saf-controls">
      <div class="row">
        <button class="btn gold xl" id="sGo" data-primary>▶ Empezar</button>
        <button class="btn ghost" id="sReset">↺ Reiniciar</button>
        <button class="btn" id="sFull">⛶ Pantalla grande</button>
        <button class="btn red" id="sNoise" title="Atajo: tecla R">📢 ¡Ruido! (manual)</button>
        <a class="btn ghost" href="https://www.shysafari.com/" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">🌍 Abrir Shy Safari (original)</a>
      </div>
      <div class="row">
        <label class="chk">Animales: <select class="field" id="sCount"></select></label>
        <label class="chk">Tiempo total: <select class="field" id="sMins">${[[1, '1 min (prueba)'], [3, '3 min'], [5, '5 min'], [10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min']].map(m => `<option value="${m[0]}" ${o.mins === m[0] ? 'selected' : ''}>${m[1]}</option>`).join('')}</select></label>
        <label class="chk"><input type="checkbox" id="sLab" ${o.labels ? 'checked' : ''}> Mostrar nombres</label>
        <label class="chk"><input type="checkbox" id="sMic" ${o.mic ? 'checked' : ''}> Usar micrófono</label>
        <label class="chk">Premio: +<input class="field" type="number" min="0" max="50" id="sPts" value="${o.pts}" style="width:64px"> en 💯 Puntos de la clase</label>
      </div>
      <div class="row">
        <span class="muted">🎙️ Nivel de ruido:</span><div class="saf-meter"><div class="f" id="sMf"></div><div class="t" id="sMt"></div></div>
        <label class="chk">Límite <input type="range" min="10" max="95" id="sThr" value="${o.thr}"></label>
        <label class="chk">Sensibilidad <input type="range" min="1" max="10" id="sSens" value="${o.sens}"></label>
      </div>
      <p class="muted" id="sMicMsg" style="font-size:.88rem">🎙️ El micrófono solo mide el volumen; no graba nada. Sin micrófono, los animales salen con el tiempo y tú usas «📢 ¡Ruido!» (o la tecla R).</p>
    </div>`;
  const $$ = s => el.querySelector(s), scene = $$('#scene'), wrap = $$('#sWrap');

  function fillCount() {
    const n = H().animals.length;
    if (o.count > n) o.count = 0;
    $$('#sCount').innerHTML = [5, 8].filter(k => k < n).map(k => `<option value="${k}" ${o.count === k ? 'selected' : ''}>${k}</option>`).join('') + `<option value="0" ${!o.count ? 'selected' : ''}>Todos (${n})</option>`;
  }
  function drawScene() {
    const hab = H();
    scene.className = 'scene' + (o.labels ? '' : ' nolabels');
    scene.innerHTML = hab.bg()
      + (hab.bubbles ? rep(10, i => `<div class="bubble" style="left:${5 + i * 9.5}%;animation-duration:${6 + (i % 4) * 2}s;animation-delay:${-i * 1.3}s"></div>`) : '')
      + `<div class="hud tl"><span class="pillx title">${hab.e} ${h(hab.short || hab.t)}</span></div>
         <div class="hud tr"><span class="pillx" id="sCnt">🐾 0 / 0</span></div>
         <div class="saf-lvl"><div class="f" id="sLf"></div><div class="t" id="sLt"></div></div>
         <div class="hud tc"><div class="saf-msg" id="sMsg">${hab.hidden || '🤫 Los animales están escondidos…'}</div></div><div class="hud bot"><div class="saf-prog"><div id="sProg"></div></div></div>
         <button class="btn gold saf-exit" id="sExit">✕ Salir de pantalla grande</button>`;
    scene.querySelector('#sExit').onclick = toggleFull;
    placeThr(); updCount();
    if (st.state === 'idle') showStartCard();
    st.shown.forEach(a => addAnimal(a, false));
  }
  function showStartCard() {
    const hab = H(), n = o.count || hab.animals.length;
    const c = document.createElement('div'); c.className = 'saf-start'; c.id = 'sStart';
    c.innerHTML = `<div class="card"><div class="t1">🐾 Safari silencioso</div>
      <div class="t2">${hab.intro ? h(hab.intro) : `¿Quién vive en ${h(lowerFirst(hab.t))}? Trabajen en silencio y los animales van a salir… ¡${n} animales tímidos!`}</div>
      <div class="shadow">${hab.animals.slice(0, Math.min(n, 8)).map(a => a[0]).join('')}</div>
      <button class="btn gold xl" style="font-size:2.2cqw;margin-top:1.4cqw">▶ Empezar</button></div>`;
    c.querySelector('button').onclick = start;
    scene.appendChild(c);
  }
  function updCount() { const c = scene.querySelector('#sCnt'); if (c) c.textContent = `🐾 ${st.shown.length} / ${st.total || (o.count || H().animals.length)}`; }
  function setMsg(t, cls = '', hold = 0) {
    const now = Date.now(); if (!hold && now < st.msgUntil) return;
    if (hold) st.msgUntil = now + hold;
    const m = scene.querySelector('#sMsg'); if (!m) return;
    if (m.textContent !== t) m.textContent = t; m.className = 'saf-msg ' + cls;
  }
  function placeThr() {
    const lt = scene.querySelector('#sLt'); if (lt) lt.style.bottom = o.thr + '%';
    const mt = $$('#sMt'); if (mt) mt.style.left = o.thr + '%';
  }
  function assignSpots(list) {
    const all = shuffle(Object.entries(H().spots).flatMap(([z, arr]) => arr.map((p, i) => ({ z, p, k: z + i }))));
    const used = new Set();
    list.forEach(a => {
      const c = all.find(s => s.z === a[2] && !used.has(s.k)) || all.find(s => !used.has(s.k)) || pick(all);
      used.add(c.k); st.pos.set(a[1], c.p);
    });
  }
  function addAnimal(a, anim = true) {
    const p = st.pos.get(a[1]);
    const d = document.createElement('div');
    d.className = 'animal' + (anim ? ' in' + (H().drop ? ' drop' : '') : ''); d.dataset.n = a[1];
    d.style.cssText = `left:${p[0]}%;top:${p[1]}%;--s:${a[3]};--d:${-Math.random() * 3}s`;
    d.innerHTML = `<span class="em">${a[0]}</span><span class="lab">${h(a[1])}</span>`;
    d.onclick = () => openFact(a);
    scene.appendChild(d);
  }
  function openFact(a) {
    if (st.factOpen) return;
    const wasRun = st.state === 'run'; if (wasRun) pause();
    st.factOpen = true;
    const f = document.createElement('div'); f.className = 'fact';
    f.innerHTML = `<div class="fe">${a[0]}</div><div class="fn">${h(nameCap(a))}</div><div class="ft">${h(a[4])}</div>
      <button class="btn" data-say>🔈 Escuchar</button><button class="btn gold" data-close>${wasRun ? '▶ Cerrar y seguir' : 'Cerrar'}</button>`;
    f.querySelector('[data-say]').onclick = () => say(nameCap(a) + '. ' + a[4]);
    f.querySelector('[data-close]').onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} f.remove(); st.factOpen = false; if (wasRun) resume(); };
    scene.appendChild(f);
  }
  function say(text) {
    try {
      const u = new SpeechSynthesisUtterance(text); u.lang = 'es-MX'; u.rate = .85;
      const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { toast('Este navegador no puede leer en voz alta'); }
  }

  async function micOn() {
    if (st.stream || !o.mic) return;
    try {
      st.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const a = ac(), src = a.createMediaStreamSource(st.stream); st.an = a.createAnalyser(); st.an.fftSize = 1024; src.connect(st.an);
      st.buf = new Uint8Array(st.an.fftSize);
      $$('#sMicMsg').textContent = '🎙️ Micrófono activo: solo mide el volumen, no graba nada. Ajusta el «Límite» si los animales se asustan muy fácil.';
    } catch (e) {
      st.stream = null; st.an = null;
      $$('#sMicMsg').textContent = '⚠️ No se pudo usar el micrófono. El juego sigue con el tiempo: usa «📢 ¡Ruido!» (o la tecla R) cuando haya mucho ruido.';
    }
  }
  function micOff() { if (st.stream) st.stream.getTracks().forEach(t => t.stop()); st.stream = null; st.an = null; st.level = 0; }
  function readLevel() {
    let lvl = 0;
    if (st.an) { st.an.getByteTimeDomainData(st.buf); let sum = 0; for (const v of st.buf) { const d = (v - 128) / 128; sum += d * d; } lvl = Math.min(100, Math.sqrt(sum / st.buf.length) * 100 * o.sens * 1.6); }
    if (typeof window.__safLevel === 'number') lvl = window.__safLevel;
    if (Date.now() < st.ignoreUntil) lvl = 0;
    st.level = st.level * .6 + lvl * .4;
    const w = st.level + '%', a = scene.querySelector('#sLf'), b = $$('#sMf');
    if (a) a.style.height = w; if (b) b.style.width = w;
  }

  async function start() {
    const hab = H(), n = o.count || hab.animals.length;
    st.queue = shuffle(hab.animals).slice(0, n); st.total = n; st.shown = []; st.pos = new Map();
    assignSpots(st.queue);
    st.per = o.mins * 60 / n; st.prog = 0; st.over = 0; st.cool = 0;
    st.state = 'run'; drawScene(); updButtons();
    setMsg('🤫 Silencio… los animales tímidos están escuchando', '', 2500);
    ac(); await micOn();
  }
  function pause() { if (st.state !== 'run') return; st.state = 'pause'; setMsg('⏸ Pausa', '', 1); updButtons(); }
  function resume() { if (st.state !== 'pause') return; st.state = 'run'; st.msgUntil = 0; setMsg('🤫 Silencio…'); updButtons(); }
  function reset() { st.state = 'idle'; st.shown = []; st.queue = []; st.total = 0; st.factOpen = false; micOff(); drawScene(); updButtons(); }
  function updButtons() {
    const b = $$('#sGo');
    b.textContent = st.state === 'run' ? '⏸ Pausa' : st.state === 'pause' ? '▶ Seguir' : st.state === 'done' ? '🔁 Otra vez' : '▶ Empezar';
    b.className = 'btn xl ' + (st.state === 'run' ? 'red' : 'gold');
    const lock = st.state === 'run' || st.state === 'pause';
    el.querySelectorAll('#habPick button').forEach(x => x.disabled = lock);
    $$('#sCount').disabled = lock; $$('#sMins').disabled = lock;
  }

  function sayBubble(a, text, ms = 4200) {
    const d = [...scene.querySelectorAll('.animal')].find(x => x.dataset.n === a[1] && !x.classList.contains('out')); if (!d) return;
    d.querySelectorAll('.say').forEach(x => x.remove());
    const p = st.pos.get(a[1]) || [50, 50], b = document.createElement('div');
    b.className = 'say' + (p[0] < 18 ? ' l' : p[0] > 82 ? ' r' : '') + (p[1] < 26 ? ' below' : '');
    b.textContent = text; d.appendChild(b); setTimeout(() => b.remove(), ms);
  }
  function reveal() {
    const a = st.queue.shift(); if (!a) return;
    st.shown.push(a); addAnimal(a, true); updCount();
    st.ignoreUntil = Date.now() + 900; tone(1320, .3, .05, 'sine');
    setMsg(`✨ ¡Salió ${a[1]}!`, '', 2600);
    if (H().talk) setTimeout(() => sayBubble(a, a[5] || pick(H().cheers || CHEERS)), H().drop ? 1300 : 900);
    st.cheerT = 0;
    if (!st.queue.length) done();
  }
  function scare() {
    const now = Date.now(); if (now < st.cool) return;
    st.cool = now + 3000; st.prog = 0; st.over = 0;
    const a = st.shown.pop();
    if (a) {
      const d = [...scene.querySelectorAll('.animal')].find(x => x.dataset.n === a[1] && !x.classList.contains('out'));
      if (d) { d.classList.add('out'); setTimeout(() => d.remove(), 700); }
      st.queue.unshift(a); updCount();
      setMsg(`😱 ¡Mucho ruido! ${nameCap(a)} se escondió.`, 'bad', 3000);
    } else setMsg('😱 ¡Mucho ruido! Los animales no quieren salir.', 'bad', 3000);
    tone(220, .35, .08, 'sawtooth');
  }
  function done() {
    st.state = 'done'; micOff(); updButtons();
    const hab = H(); let ptsMsg = '';
    if (hab.talk) { const dp = st.shown.find(a => a[1] === 'Don Pico'); setTimeout(() => sayBubble(dp || st.shown[0], hab.finale || '¡Muy bien, guardianes! ¡Qué orgullo!', 6000), 200); }
    if (o.pts > 0) { const d = cdata(); if (!d.points) d.points = { pts: 0, goal: 50, reward: '🎉 ¡Fiesta de baile!' }; d.points.pts += o.pts; save(); ptsMsg = `<p style="font-size:2.2cqw;font-weight:800;color:var(--bg)">+${o.pts} puntos para la clase 💯 (total: ${d.points.pts})</p>`; }
    setTimeout(() => {
      if (!scene.isConnected) return;
      fanfare();
      for (let i = 0; i < 36; i++) { const c = document.createElement('div'); c.className = 'saf-confetti'; c.textContent = pick(st.shown.map(a => a[0]).filter(x => !x.includes('<')).concat(['✨', '🎉', '⭐'])); c.style.left = Math.random() * 100 + '%'; c.style.animationDuration = (2.5 + Math.random() * 2) + 's'; c.style.animationDelay = Math.random() * .8 + 's'; scene.appendChild(c); setTimeout(() => c.remove(), 5500); }
      const w = document.createElement('div'); w.className = 'saf-done';
      w.innerHTML = `<div class="card"><div class="big">${hab.doneTitle || (hab.talk ? '¡Encontraron a todos los guardianes!' : '¡Encontraron a todos!')}</div><div class="row2">${st.shown.map(a => a[0]).join(' ')}</div>
        <p style="font-size:2cqw;color:#5a5a5a">${hab.doneText ? h(hab.doneText) : hab.talk ? `Chica y sus amigos salieron gracias a su silencio.` : `${st.total} animales de ${h(hab.where || lowerFirst(hab.t))} salieron gracias a su silencio.`}</p>${ptsMsg}
        <button class="btn gold" style="font-size:2cqw;padding:1cqw 2.4cqw;margin-top:1cqw">👀 Ver a los animales</button></div>`;
      w.querySelector('button').onclick = () => w.remove();
      scene.appendChild(w);
    }, 1000);
  }
  function loop() {
    readLevel();
    const nowT = Date.now(), dt = Math.min(1, Math.max(0, (nowT - (st.lastT || nowT)) / 1000)); st.lastT = nowT;
    if (st.state !== 'run') return;
    const now = Date.now(), thr = o.thr, nervous = st.level > thr * .75;
    scene.classList.toggle('nervous', nervous);
    if (now < st.cool) { const p = scene.querySelector('#sProg'); if (p) p.style.width = '0%'; return; }
    if (st.level > thr) { st.over += dt; setMsg('😬 ¡Shhh! Los animales tienen miedo…', 'warn'); if (st.over >= .7) scare(); }
    else if (nervous) { st.over = Math.max(0, st.over - dt); setMsg('🤫 Un poquito más bajo…', 'warn'); }
    else { st.over = 0; st.prog += dt; setMsg('🤫 Silencio… alguien viene');
      if (H().talk && st.shown.length) { st.cheerT = (st.cheerT || 0) + dt; if (st.cheerT >= 20) { st.cheerT = 0; sayBubble(pick(st.shown), pick(H().cheers || CHEERS)); } } if (st.prog >= st.per) { st.prog = 0; reveal(); } }
    const p = scene.querySelector('#sProg'); if (p) p.style.width = Math.min(100, st.prog / st.per * 100) + '%';
  }
  st.iv = setInterval(loop, 100);
  window.SAF = { tick: loop, toggle: () => $$('#sGo').click(),
    info: () => ({ state: st.state, n: st.shown.length, total: st.total || (o.count || H().animals.length), level: st.level, thr: o.thr, e: H().e, msg: ((scene.querySelector('#sMsg') || {}).textContent) || '' }) };

  function toggleFull() {
    const on = !wrap.classList.contains('full');
    wrap.classList.toggle('full', on);
    try { if (on && !document.fullscreenElement) document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }
  const onFs = () => { if (!document.fullscreenElement) wrap.classList.remove('full'); };
  const onKey = e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'r' || e.key === 'R') { if (st.state === 'run') scare(); }
    if (e.key === 'Escape' && wrap.classList.contains('full') && !document.fullscreenElement) wrap.classList.remove('full');
  };
  document.addEventListener('fullscreenchange', onFs); document.addEventListener('keydown', onKey);

  el.querySelectorAll('#habPick button').forEach(b => b.onclick = () => { o.hab = b.dataset.h; persist(); el.querySelectorAll('#habPick button').forEach(x => x.classList.toggle('on', x === b)); fillCount(); reset(); });
  $$('#sGo').onclick = () => { if (st.state === 'run') pause(); else if (st.state === 'pause') resume(); else start(); };
  $$('#sReset').onclick = reset;
  $$('#sFull').onclick = toggleFull;
  $$('#sNoise').onclick = () => { if (st.state === 'run') scare(); else toast('Primero empieza el juego'); };
  $$('#sCount').onchange = e => { o.count = +e.target.value; persist(); if (st.state === 'idle' || st.state === 'done') reset(); };
  $$('#sMins').onchange = e => { o.mins = +e.target.value; persist(); };
  $$('#sLab').onchange = e => { o.labels = e.target.checked; persist(); scene.classList.toggle('nolabels', !o.labels); };
  $$('#sMic').onchange = e => { o.mic = e.target.checked; persist(); if (!o.mic) micOff(); else if (st.state === 'run' || st.state === 'pause') micOn(); };
  $$('#sPts').onchange = e => { o.pts = Math.max(0, Math.min(50, +e.target.value || 0)); persist(); };
  $$('#sThr').oninput = e => { o.thr = +e.target.value; persist(); placeThr(); };
  $$('#sSens').oninput = e => { o.sens = +e.target.value; persist(); };

  fillCount(); drawScene(); updButtons();
  return () => { window.SAF = null; clearInterval(st.iv); micOff(); document.removeEventListener('fullscreenchange', onFs); document.removeEventListener('keydown', onKey); if (wrap.classList.contains('full') && document.fullscreenElement) document.exitFullscreen(); };
});

function announce(name, reason, onClose) {
  const box = document.createElement('div'); box.className = 'sem-full';
  box.innerHTML = `<div class="scene" id="semScene">${HABITATS.chiquibul.bg()}
    <div class="sem-pico">${IMG('donpico').replace('class="art"', '')}</div>
    <div class="sem-bub" id="semBub"><div class="sem-l1">📣 ¡Atención, guardianes de Chiquibul!</div></div>
    <div class="sem-btns"><button class="btn" id="semSay">🔈 Escuchar</button><button class="btn" id="semRe">🔁 Repetir</button><button class="btn gold" id="semX">✕ Cerrar</button></div></div>`;
  document.body.appendChild(box);
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); } catch (e) {}
  const sc = box.querySelector('#semScene'), bub = box.querySelector('#semBub'), timers = [];
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const sentence = `¡Atención, guardianes de Chiquibul! La estrella de la semana es... ¡${name}! ¡${capFirst(reason)}! ¡Felicidades!`;
  function run() {
    timers.forEach(clearTimeout); timers.length = 0; sc.querySelectorAll('.sem-friend,.saf-confetti').forEach(x => x.remove());
    bub.innerHTML = `<div class="sem-l1">📣 ¡Atención, guardianes de Chiquibul!</div>`; ac(); tone(660, .2, .1, 'triangle'); tone(880, .3, .1, 'triangle', .18);
    later(2300, () => { bub.innerHTML = `<div class="sem-l1">La estrella de la semana es…</div><div style="font-size:5cqw;margin-top:1cqw">🥁</div>`; for (let i = 0; i < 22; i++) tone(140 + (i % 2) * 20, .07, .12, 'square', i * .1); });
    later(4800, () => {
      bub.innerHTML = `<div class="sem-l1">La estrella de la semana es…</div><div class="sem-name">⭐ ${h(name)} ⭐</div><div class="sem-why">¡${h(capFirst(reason))}!</div>`;
      fanfare();
      for (let i = 0; i < 46; i++) { const c = document.createElement('div'); c.className = 'saf-confetti'; c.textContent = pick(['⭐', '🌟', '🎉', '✨', '🏅', '🦋', '🌿']); c.style.left = Math.random() * 100 + '%'; c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; c.style.animationDelay = Math.random() * 1.2 + 's'; sc.appendChild(c); setTimeout(() => c.remove(), 6500); }
      [['chica', 'Chica', 52, 1.2, '¡Bravo!'], ['mora', 'Mora', 18, .7, '¡Felicidades!'], ['🐹<small class="badge">🧺</small>', 'Nico', 84, 1, '¡Qué bien!'], ['🐗', 'Bruno', 68, 1, '¡Genial!']].forEach(([art, nm, x, s, txt], i) => later(700 + i * 500, () => {
        const f = document.createElement('div'); f.className = 'sem-friend';
        f.style.cssText = `left:${x}%;bottom:${nm === 'Mora' ? 70 : 2}%;transform:translateX(-50%);font-size:${7 * s}cqw`;
        f.innerHTML = `${ART[art] ? IMG(art) : art}<div class="say${x > 85 ? ' r' : x < 15 ? ' l' : ''}">${txt}</div>`; sc.appendChild(f);
      }));
    });
  }
  box.querySelector('#semSay').onclick = () => { try { const u = new SpeechSynthesisUtterance(sentence); u.lang = 'es-MX'; u.rate = .9; const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };
  box.querySelector('#semRe').onclick = run;
  box.querySelector('#semX').onclick = () => { timers.forEach(clearTimeout); try { speechSynthesis.cancel(); } catch (e) {} box.remove(); if (document.fullscreenElement) document.exitFullscreen(); if (onClose) onClose(); };
  run();
}

function linkIcon(u) {
  const x = String(u).toLowerCase();
  if (x.includes('canva.')) return '🎨'; if (x.includes('cuentopolis')) return '📚';
  if (x.includes('youtu')) return '▶️'; if (x.includes('docs.google') || x.includes('drive.google')) return '📄';
  if (x.includes('wayground') || x.includes('quizizz')) return '🎯'; if (x.includes('quizlet')) return '🃏';
  if (x.includes('charlas')) return '📅'; if (x.includes('agenda')) return '📋'; if (x.includes('passport')) return '🌎';
  return '🔗';
}
function cleanUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  const m = u.match(/src="([^"]+)"/); if (m) u = m[1];            // pasted a whole <iframe> embed code
  if (!/^https?:\/\//i.test(u) && !/^[\w-]+\.html/i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  return u;
}
function toEmbed(u) {
  try {
    const x = new URL(u, location.href), host = x.hostname.replace(/^www\./, '');
    if (host.endsWith('canva.com')) {
      const m = x.pathname.match(/\/design\/([^/]+)(?:\/([^/]+))?\/(view|edit|watch|present)/);
      if (m) return `https://www.canva.com/design/${m[1]}/${m[2] ? m[2] + '/' : ''}view?embed`;
    }
    if (host.endsWith('youtube.com') && x.searchParams.get('v')) return 'https://www.youtube.com/embed/' + x.searchParams.get('v');
    if (host === 'youtu.be') return 'https://www.youtube.com/embed/' + x.pathname.slice(1);
    return x.href;
  } catch (e) { return u; }
}
function niceDate(d) { try { return new Date(d).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return ''; } }

const VIEW = { open: [], cur: -1 };
function openLink(x) {
  if (!x) return;
  const src = toEmbed(x.u);
  let i = VIEW.open.findIndex(v => v.src === src);
  if (i < 0) {
    if (VIEW.open.length >= 5) { const old = VIEW.open.shift(); old.frame.remove(); }
    const f = document.createElement('iframe');
    f.src = src; f.allow = 'fullscreen; autoplay; clipboard-write'; f.setAttribute('allowfullscreen', ''); f.referrerPolicy = 'strict-origin-when-cross-origin';
    $('#vFrames').appendChild(f);
    VIEW.open.push({ n: x.n, u: x.u, src, frame: f }); i = VIEW.open.length - 1;
    const hint = document.createElement('div'); hint.className = 'vhint'; hint.textContent = '¿Sale en blanco o con error? Usa «↗ Abrir en pestaña nueva» y la 🪟 Ventana flotante.';
    $('#vFrames').appendChild(hint); setTimeout(() => hint.style.opacity = 0, 6000); setTimeout(() => hint.remove(), 7000);
  }
  showView(i);
}
function showView(i) {

function speakEs(text, rate = .9) {
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'es-MX'; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v => /^es[-_](MX|US|419)/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^es/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { toast('Este navegador no puede leer en voz alta'); }
}

  const onKey = e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable || e.ctrlKey || e.metaKey || e.altKey) return;

/* =========================================================
   🗣️ JUEGOS DE FLUIDEZ (CI, máximo B1)
   ========================================================= */
const FL_LEVELS = { na: 'Novato alto (A2)', ib: 'Intermedio bajo (A2/B1)', i: 'Intermedio (B1)' };
const FL_CLASS_DEFAULT = n => { n = (n || '').toLowerCase(); if (n.includes('secondary 2')) return 'i'; if (n.includes('secondary 1') || n.includes('middle school 3') || n.includes('middle school 2')) return 'ib'; return 'na'; };
const FL_WORD_BANKS = { na: ['ms0', 'ms1'], ib: ['ms2', 'sec1'], i: ['sec2', 'sec1'] };
function flLevel() { const d = cdata(); if (!d.fluid) d.fluid = { lvl: FL_CLASS_DEFAULT(cname()) }; return d.fluid; }
function flLevelSelect(id, cur) { return `<label class="chk">Nivel: <select class="field" id="${id}">${Object.entries(FL_LEVELS).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`; }
const CIRCUM = ['Es una cosa que…', 'Es una persona que…', 'Es un lugar donde…', 'Se usa para…', 'Es como… pero…', 'Es lo contrario de…', 'No sé la palabra, pero…', 'Por ejemplo…'];
/* local countdown used by the three games */
function flTimer(el, sec, onEnd) {
  const o = { sec, left: sec, run: false, end: 0, iv: 0 };
  const paint = () => { const d = el.querySelector('.fl-clock'), b = el.querySelector('.fl-bar div'); if (!d) return; d.textContent = fmt(o.left); d.classList.toggle('low', o.run && o.left <= 10); if (b) b.style.width = (o.left / o.sec * 100) + '%'; };
  o.start = () => { if (o.run) return; ac(); if (o.left <= 0) o.left = o.sec; o.run = true; o.end = Date.now() + o.left * 1000; o.iv = setInterval(() => { o.left = Math.max(0, (o.end - Date.now()) / 1000); paint(); if (o.left <= 0) { o.stop(); ding(); setTimeout(ding, 250); onEnd && onEnd(); } }, 200); paint(); };
  o.stop = () => { o.run = false; clearInterval(o.iv); paint(); };
  o.reset = s => { o.stop(); if (s) o.sec = s; o.left = o.sec; paint(); };
  o.paint = paint;
  return o;
}

    while (o.p < target) { o.p++; layout(); const c = spr('chica'); c.classList.remove('hop'); void c.offsetWidth; c.classList.add('hop'); tick(); await wait(330); if (!el.isConnected) return; }
    o.busy = false; $$('#spGo').disabled = false;
  }
  async function next() {
    if (o.busy) return; ac();
    if (o.done) { Object.assign(o, { p: 0, stop: 0, line: -1, joined: [], done: false }); render(); return; }
    const st = C.stops[o.stop];
    if (o.line + 1 < st.lines.length) {
      if (o.line < 0 && o.p < st.at) { el.querySelectorAll('.sp-say').forEach(b => b.classList.remove('on')); $$('#spLine').textContent = '🚶 …'; await walkTo(st.at); if (!el.isConnected) return; }
      o.line++; const l = st.lines[o.line]; say(l[0], l[1]); $$('#spLine').innerHTML = `<b>${h(spWho(l[0]).n)}:</b> ${h(l[1])}`;
      el.querySelectorAll('.sp-dots span').forEach((d, i) => d.classList.toggle('on', i <= o.stop));
      if (o.stop === C.stops.length - 1 && o.line === st.lines.length - 1) { o.done = true; setTimeout(() => { if (!el.isConnected) return; fanfare(); confetti(['🌳', '⭐', '🦋', '🎉']); $$('#spGo').textContent = '↺ Otra vez'; }, 1800); }
      return;
    }
    if (st.who && !st.stays && !o.joined.includes(st.who)) o.joined.push(st.who);
    o.stop++; o.line = -1; $$('#spQt').textContent = '❓ ' + C.stops[o.stop].q; next();
  }
  $$('#spGo').onclick = next;
  $$('#spQ').onclick = () => { o.showQ = !o.showQ; $$('#spQt').classList.toggle('hidden', !o.showQ); $$('#spQ').textContent = o.showQ ? '🙈 Esconder pregunta' : '❓ Pregunta para la clase'; };
  $$('#spSay').onclick = () => { const s = C.stops[o.stop], l = s && o.line >= 0 ? s.lines[o.line] : null; if (l) say(l[0], l[1]); };
  $$('#spV').onchange = e => { o.voice = e.target.checked; };
  $$('#spReset').onclick = () => { Object.assign(o, { p: 0, stop: 0, line: -1, joined: [], done: false, busy: false }); try { speechSynthesis.cancel(); } catch (e) {} render(); };
  $$('#spFull').onclick = () => fullBox($$('#spWrap'));
  return () => { ro.disconnect(); o.busy = false; try { speechSynthesis.cancel(); } catch (e) {} };
});

/* ---------- tool order in the menu ---------- */
const TOOL_ORDER = ['links', 'pizarra', 'tareas', 'qr', 'prof', 'rubricas', 'check', 'exit', 'resultados', 'practica', 'ahorcado', 'camino', 'enigma', 'escape', 'minuto', 'conexiones', 'otramanera', 'timer', 'safari', 'sonidos', 'check', 'wheel', 'picker', 'cold', 'groups', 'pairs', 'seats', 'part', 'dados', 'exit',
  'espanol', 'points', 'houses', 'semana', 'mystery', 'stickers', 'tokens', 'levels', 'reward',
  'tpr', 'story', 'vocab', 'character', 'problem', 'location', 'cubes', 'qwords', 'verbs', 'tenses', 'convo', 'circ'];
TOOLS.sort((a, b) => { const ia = TOOL_ORDER.indexOf(a.id), ib = TOOL_ORDER.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });

/* =========================================================
   NAV + RENDER
   ========================================================= */
let cleanup = null;
const DEFAULT_FAVS = ['links', 'timer', 'safari', 'wheel', 'espanol', 'pizarra'];
let NAVQ = '';
function favs() { const g = gdata(); if (!g.favs) g.favs = DEFAULT_FAVS.slice(); return g.favs; }
function navBtn(t) {
  const f = favs().includes(t.id);
  return `<div class="nav-item"><button class="nav-btn ${S.tool === t.id ? 'on' : ''}" data-tool="${t.id}"><span class="ic">${t.icon}</span><span>${t.es}<span class="en">${t.en}</span></span></button><button class="star ${f ? 'on' : ''}" data-star="${t.id}" title="${f ? 'Quitar de favoritas' : 'Añadir a favoritas'}">${f ? '★' : '☆'}</button></div>`;
}
function buildNav() {
  const q = NAVQ.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const match = t => !q || (t.es + ' ' + t.en).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(q);
  const fav = favs().map(id => TOOLS.find(t => t.id === id)).filter(Boolean);
  $('#nav').innerHTML = `<input class="nav-search" id="navQ" placeholder="🔎 Buscar herramienta…" value="${h(NAVQ)}">`
    + (q ? `<div class="sec-title">Resultados</div>` + (TOOLS.filter(match).map(navBtn).join('') || '<p class="nav-empty">Nada con ese nombre.</p>')
    : (fav.length ? `<div class="sec-title">⭐ Favoritas</div>` + fav.map(navBtn).join('') : '')
      + SECTIONS.map(([sid, title]) => `<div class="sec-title">${title}</div>` + TOOLS.filter(t => t.sec === sid).map(navBtn).join('')).join(''))
    + `<div class="backup"><button class="tb-btn" id="expBtn">💾 Guardar copia</button><button class="tb-btn" id="impBtn">📂 Cargar copia</button>
       <p>Los puntos, stickers y niveles se guardan en este navegador. Guarda una copia de vez en cuando por si acaso.</p></div>`;
  $('#nav').querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { NAVQ = ''; go(b.dataset.tool); });
  $('#nav').querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const f = favs(), id = b.dataset.star, i = f.indexOf(id); if (i < 0) f.push(id); else f.splice(i, 1); save(); buildNav(); });
  const nq = $('#navQ'); nq.oninput = () => { NAVQ = nq.value; buildNav(); const n = $('#navQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  $('#expBtn').onclick = exportData; $('#impBtn').onclick = () => $('#importFile').click();
}
function go(id) { S.tool = id; history.replaceState(null, '', '#' + id); buildNav(); render(); window.scrollTo({ top: 0 }); }
function render() {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const t = TOOLS.find(x => x.id === S.tool) || TOOLS[0], p = $('#panel');
  const placeholder = !S.usingFile || roster().some(n => /^Estudiante \d+$/.test(n));
  p.innerHTML = `<div class="p-head"><h2>${t.icon} ${t.es}</h2><span class="cls">${h(cname())}</span></div><p class="hint">${t.hint}</p>`
    + (placeholder ? `<div class="notice">📝 Estos son nombres de ejemplo. Cuando escribas los nombres reales en <b>data/clases.json</b> (en GitHub), aparecerán aquí automáticamente.</div>` : '');
  const box = document.createElement('div'); p.appendChild(box);
  const c = t.render(box); if (typeof c === 'function') cleanup = c;
}

/* ---------- class select + attendance ---------- */
function buildClassSel() {
  $('#classSel').innerHTML = S.clases.map((c, i) => `<option value="${i}" ${i === S.cur ? 'selected' : ''}>${h(c.nombre)}</option>`).join('');
}
$('#classSel').onchange = e => { S.cur = +e.target.value; S.store.lastClass = cname(); save(); render(); };
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); };
$('#fsBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S.store, null, 2)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'herramientas-copia-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.c) throw 0; if (confirm('¿Reemplazar los datos actuales con esta copia?')) { S.store = Object.assign({ c: {}, g: {} }, d); save(); render(); toast('Copia cargada ✔'); } } catch (err) { alert('Ese archivo no es una copia válida.'); } };
  r.readAsText(f); e.target.value = '';
};

/* ---------- keyboard: space = main button ---------- */
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || /INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) return;
  if ($('#overlay').classList.contains('show')) { e.preventDefault(); $('#ovOk').click(); return; }
  const b = $('#panel [data-primary]'); if (b && !b.disabled) { e.preventDefault(); b.click(); }
});

/* ---------- start ---------- */
(async function init() {
  const fromHash = location.hash.slice(1); if (TOOLS.some(t => t.id === fromHash)) S.tool = fromHash;
  try {
    const res = await fetch('data/clases.json', { cache: 'no-store' });
    if (!res.ok) throw 0; const j = await res.json();
    if (Array.isArray(j.clases) && j.clases.length) { S.clases = j.clases; S.usingFile = true; }
  } catch (e) {}
  const li = S.clases.findIndex(c => c.nombre === S.store.lastClass); S.cur = li >= 0 ? li : 0;
  buildClassSel(); buildNav(); render();
})();
</script>
