<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ronda Rápida — Cuentopolis</title>
<style>
  :root{
    --navy:#0B2545; --gold:#C9A961; --parchment:#F6EFE0; --parchment-dark:#EDE2C8;
    --forest:#2F6B4F; --purple:#5B3A82; --coral:#C4544A; --mint:#3F8F63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--navy);
    background-image: radial-gradient(circle at 20% 20%, rgba(201,169,97,.08), transparent 40%),
                       radial-gradient(circle at 80% 80%, rgba(201,169,97,.06), transparent 40%);
    font-family:Georgia, 'Times New Roman', serif; color:var(--parchment);
    display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  .badge{position:fixed; bottom:16px; right:18px; width:64px; height:64px; border-radius:50%;
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-size:.62rem; text-align:center; color:var(--gold); letter-spacing:.5px;
    background:var(--navy); line-height:1.1; padding:4px;}
  h1{font-size:2.1rem; margin:6px 0 2px; text-align:center;}
  .sub{font-style:italic; color:var(--gold); font-size:.95rem; margin-bottom:14px; text-align:center;}
  .setup, .card, .end{background:var(--parchment); color:var(--navy); border:3px double var(--gold); border-radius:6px;
    padding:26px; max-width:760px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4); text-align:center;}
  .setup label{display:block; margin:14px 0 6px; color:var(--purple); font-style:italic;}
  .setup input{padding:8px; border-radius:6px; border:1px solid var(--gold); width:80px; text-align:center; font-size:1rem;}
  #teamNames{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px;}
  #teamNames input{width:130px;}
  .btn{background:var(--gold); color:var(--navy); border:none; border-radius:6px;
    padding:12px 26px; font-size:1.05rem; font-weight:bold; cursor:pointer; margin-top:16px; margin-right:8px; font-family:Georgia,serif;}
  .btn.outline{background:var(--navy); color:var(--parchment); border:1px solid var(--gold);}
  .card{display:none;}
  .qmeta{color:var(--purple); font-style:italic; margin-bottom:8px;}
  .timer{font-size:2.4rem; font-weight:bold; margin-bottom:10px;}
  .timer.low{color:var(--coral);}
  .question{font-size:1.4rem; margin-bottom:20px;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;}
  @media(max-width:560px){.choices{grid-template-columns:1fr;}}
  .choice{background:var(--navy); color:var(--parchment); border:2px solid var(--gold); border-radius:6px;
    padding:16px; font-size:1.05rem; font-weight:bold; cursor:pointer; font-family:Georgia,serif;}
  .choice.correct{background:var(--mint); border-color:var(--mint); color:#fff;}
  .choice.wrong{background:var(--coral); border-color:var(--coral); color:#fff;}
  .scoreboard{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0;}
  .team{background:var(--navy); color:var(--parchment); border:1px solid var(--gold); border-radius:6px; padding:8px 14px;}
  .team .pts{font-size:1.3rem; color:var(--gold); font-weight:bold;}
  .award{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .award button{background:var(--parchment-dark); color:var(--navy); border:1px solid var(--gold);
    border-radius:6px; padding:8px 12px; cursor:pointer;}
  .end{display:none;}
  .end h2{font-size:2rem;}
  .unitBtn{display:block; width:100%; text-align:left; background:var(--navy); color:var(--parchment);
    border:1px solid var(--gold); border-radius:6px; padding:16px 18px; margin-bottom:12px; font-size:1.1rem;
    font-weight:bold; cursor:pointer; font-family:Georgia,serif;}
  .unitBtn small{display:block; font-weight:normal; font-style:italic; font-size:.8rem; margin-top:4px; opacity:.8;}
</style>
</head>
<body>
  <h1>⚡ Ronda Rápida</h1>
  <div class="sub">Repaso de Dominio — Juego de equipos con cronómetro</div>

  <div class="setup" id="pickerCard">
    <p style="font-size:1.2rem; margin-bottom:16px;">Elige una unidad para practicar:</p>
    <div id="unitList"></div>
  </div>

  <div class="setup" id="setup" style="display:none;">
    <p>¿Cuántos equipos van a jugar?</p>
    <input type="number" id="teamCount" min="1" max="6" value="3">
    <button class="btn" id="setTeamsBtn">Configurar Equipos</button>
    <div id="teamNames"></div>
    <button class="btn" id="startBtn" style="display:none;">Comenzar</button>
  </div>

  <div class="card" id="gameCard">
    <div class="qmeta">Pregunta <span id="qNum">1</span> / <span id="qTotal"></span></div>
    <div class="timer" id="timer">15</div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="scoreboard" id="scoreboard"></div>
    <div id="awardSection" style="display:none;">
      <p>¿Qué equipo respondió correctamente?</p>
      <div class="award" id="awardButtons"></div>
    </div>
    <button class="btn" id="nextBtn" style="display:none;">Siguiente Pregunta →</button>
  </div>

  <div class="end" id="endCard">
    <h2>🏆 ¡Puntajes Finales!</h2>
    <div class="scoreboard" id="finalScoreboard"></div>
    <button class="btn" id="restartBtn">Jugar de Nuevo</button>
    <button class="btn outline" id="switchBtn">Elegir Otra Unidad</button>
  </div>

  <div class="badge">CUENTO<br>POLIS</div>

<script>
/* =========================================================
   AÑADIR UNA NUEVA UNIDAD: copia un bloque dentro de `units`.
   El enlace de este juego NUNCA cambia.
   DEMO content below — replace with real comprehension check
   questions from an actual unit/CI lesson.
   ========================================================= */
const CONFIG = {
  units: {
    "demo-unit": {
      label: "DEMO — reemplazar con contenido real de una unidad",
      timePerQuestion: 15,
      questions: [
        { q:"¿Qué palabra significa 'lugar con muchos árboles'?", choices:["la ciudad","el bosque","el río","la montaña"], correct:1 },
        { q:"¿Cuál es el sinónimo de 'valentía'?", choices:["miedo","tristeza","coraje","duda"], correct:2 },
        { q:"Para pedir información a otra persona, tú debes...", choices:["narrar","describir","preguntar","escuchar"], correct:2 },
        { q:"Contar una historia en orden se llama...", choices:["narrar","preguntar","responder","dudar"], correct:0 },
        { q:"¿Qué modo de comunicación es una conversación de ida y vuelta?", choices:["Interpretativo","Interpersonal","Presentacional","Narrativo"], correct:1 }
      ]
    },
    "guardianes-ep1": {
      label: "Guardianes de Chiquibul — Ep. 1: ¡Hola, Chica!",
      timePerQuestion: 15,
      questions: [
        { q:"¿Cómo se llama la protagonista de la serie?", choices:["Nico","Chica","Bruno","Don Pico"], correct:1 },
        { q:"¿Quién es el maestro de la escuela en la selva?", choices:["Bruno","Nico","Don Pico","Chica"], correct:2 },
        { q:"¿De dónde es Nico, el coatí nuevo?", choices:["Guatemala","Toledo, Belice","México","Costa Rica"], correct:1 },
        { q:"¿Qué palabra usa Don Pico para describir el trabajo de Chica?", choices:["misión","aventura","fiesta","clase"], correct:0 },
        { q:"¿Quién mira de lejos y se siente un poco triste al final?", choices:["Don Pico","Nico","Bruno","Chica"], correct:2 },
        { q:"¿Cuál es la Palabra del Bosque de este episodio?", choices:["bienvenida","valentía","misterio","amistad"], correct:0 }
      ]
    }
  }
};
/* ========================================================= */

let currentUnit=null, teams=[], scores=[], qIdx=0, timeLeft=0, timerId=null, answered=false;

function showPicker(){
  document.getElementById('pickerCard').style.display='block';
  document.getElementById('setup').style.display='none';
  document.getElementById('gameCard').style.display='none';
  document.getElementById('endCard').style.display='none';
  const list = document.getElementById('unitList');
  list.innerHTML='';
  Object.entries(CONFIG.units).forEach(([key, unit])=>{
    const btn = document.createElement('button');
    btn.className='unitBtn';
    btn.innerHTML = `${unit.label}<small>${unit.questions.length} preguntas</small>`;
    btn.onclick = ()=>{ currentUnit = unit; goToSetup(); };
    list.appendChild(btn);
  });
}

function goToSetup(){
  document.getElementById('pickerCard').style.display='none';
  document.getElementById('setup').style.display='block';
  document.getElementById('qTotal').textContent = currentUnit.questions.length;
}

document.getElementById('setTeamsBtn').onclick = ()=>{
  const n = Math.max(1, Math.min(6, +document.getElementById('teamCount').value || 1));
  const box = document.getElementById('teamNames');
  box.innerHTML='';
  for(let i=0;i<n;i++){
    const inp = document.createElement('input');
    inp.placeholder = `Equipo ${i+1}`;
    inp.id = 'teamInput'+i;
    box.appendChild(inp);
  }
  document.getElementById('startBtn').style.display='inline-block';
};

document.getElementById('startBtn').onclick = ()=>{
  teams=[];
  document.querySelectorAll('[id^=teamInput]').forEach(inp=>{
    teams.push(inp.value.trim() || inp.placeholder);
  });
  scores = teams.map(()=>0);
  qIdx=0;
  document.getElementById('setup').style.display='none';
  document.getElementById('gameCard').style.display='block';
  loadQuestion();
};

function renderScoreboard(targetId){
  const box = document.getElementById(targetId);
  box.innerHTML='';
  teams.forEach((t,i)=>{
    const div = document.createElement('div');
    div.className='team';
    div.innerHTML = `${t}<br><span class="pts">${scores[i]}</span>`;
    box.appendChild(div);
  });
}

function loadQuestion(){
  answered=false;
  const item = currentUnit.questions[qIdx];
  document.getElementById('qNum').textContent = qIdx+1;
  document.getElementById('question').textContent = item.q;
  document.getElementById('awardSection').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  const box = document.getElementById('choices');
  box.innerHTML='';
  item.choices.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className='choice';
    btn.textContent = c;
    btn.onclick = ()=>revealAnswer(i);
    box.appendChild(btn);
  });
  renderScoreboard('scoreboard');
  timeLeft = currentUnit.timePerQuestion;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('timer').classList.remove('low');
  clearInterval(timerId);
  timerId = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if(timeLeft<=5) document.getElementById('timer').classList.add('low');
    if(timeLeft<=0){ clearInterval(timerId); if(!answered) revealAnswer(-1); }
  },1000);
}

function revealAnswer(clickedIdx){
  if(answered) return;
  answered=true;
  clearInterval(timerId);
  const item = currentUnit.questions[qIdx];
  document.querySelectorAll('.choice').forEach((b,i)=>{
    if(i===item.correct) b.classList.add('correct');
    else if(i===clickedIdx) b.classList.add('wrong');
  });
  const awardBox = document.getElementById('awardButtons');
  awardBox.innerHTML='';
  teams.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.textContent = t;
    btn.onclick = ()=>{ scores[i]++; renderScoreboard('scoreboard'); };
    awardBox.appendChild(btn);
  });
  document.getElementById('awardSection').style.display='block';
  document.getElementById('nextBtn').style.display='inline-block';
}

document.getElementById('nextBtn').onclick = ()=>{
  qIdx++;
  if(qIdx < currentUnit.questions.length){ loadQuestion(); }
  else {
    document.getElementById('gameCard').style.display='none';
    document.getElementById('endCard').style.display='block';
    renderScoreboard('finalScoreboard');
  }
};

document.getElementById('restartBtn').onclick = ()=>{
  qIdx=0;
  document.getElementById('endCard').style.display='none';
  document.getElementById('setup').style.display='block';
  document.getElementById('gameCard').style.display='none';
};
document.getElementById('switchBtn').onclick = showPicker;

showPicker();
</script>
</body>
</html>
