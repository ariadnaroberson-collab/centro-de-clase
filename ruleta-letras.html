<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta de Letras · Letter Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2433;--paper:#fffdf7;--line:#d9d4c7;--accent:#ff6b35;--teal:#2a9d8f;--gold:#f4b400;--soft:#f3efe4;--muted:#6b6f7a}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 18px;border-bottom:3px dashed var(--line)}
  h1{margin:0;font-size:clamp(22px,3.4vw,32px)}
  h1 span{color:var(--accent)}
  .seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 13px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
  .seg button+button{border-left:2px solid var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(280px,1.1fr) 1fr;gap:22px;align-items:start}
  @media (max-width:760px){main{grid-template-columns:1fr}}
  .wheelbox{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--ink);filter:drop-shadow(0 2px 0 #fff)}
  .hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:#fff;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(14px,2.4vw,20px);cursor:pointer;user-select:none}
  .panel{display:flex;flex-direction:column;gap:14px}
  .result{border:3px solid var(--ink);border-radius:18px;background:#fff;text-align:center;padding:10px;box-shadow:5px 5px 0 var(--ink)}
  .result small{display:block;color:var(--muted);font-size:16px}
  .result .L{font-size:clamp(90px,16vw,170px);font-weight:700;line-height:1;color:var(--accent)}
  .big{font:inherit;font-size:20px;font-weight:700;padding:12px 22px;border-radius:14px;border:3px solid var(--ink);background:var(--accent);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
  .big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .big.teal{background:var(--teal)}
  .big.ghost{background:#fff;color:var(--ink)}
  .big:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .card{border:2px dashed var(--line);border-radius:14px;padding:12px;background:#fff}
  .card label{font-weight:600;display:block;margin-bottom:6px}
  .timer{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;min-width:120px}
  .used{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .used span{border:2px solid var(--ink);border-radius:8px;padding:2px 9px;font-weight:600;background:var(--soft)}
  .muted{color:var(--muted);font-size:14px}
  .toggle{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
  .toggle input{width:20px;height:20px}
  .overlay{position:fixed;inset:0;background:rgba(29,36,51,.85);display:none;align-items:center;justify-content:center;z-index:10;cursor:pointer}
  .overlay.on{display:flex}
  .overlay div{font-size:clamp(70px,16vw,200px);font-weight:700;color:var(--gold);text-shadow:6px 6px 0 var(--accent);transform:rotate(-6deg);text-align:center}
  .overlay small{display:block;font-size:22px;color:#fff;text-shadow:none;transform:none;font-weight:400}
</style>
</head>
<body>
<header>
  <h1>🎡 <span id="tTitle">Ruleta de Letras</span></h1>
  <div class="seg" id="langSeg">
    <button data-v="es" class="on">Español</button>
    <button data-v="en">English</button>
  </div>
</header>
<main>
  <div>
    <div class="wheelbox">
      <canvas id="wheel" width="1000" height="1000"></canvas>
      <div class="pointer"></div>
      <div class="hub" id="hub">GIRAR</div>
    </div>
  </div>
  <div class="panel">
    <div class="result">
      <small id="tLetter">La letra es…</small>
      <div class="L" id="letter">?</div>
    </div>
    <div class="row">
      <button class="big" id="spinBtn">🎡 Girar</button>
      <button class="big teal" id="stopBtn">✋ ¡BASTA!</button>
    </div>
    <div class="card">
      <label id="tTimer">Temporizador</label>
      <div class="row">
        <div class="timer" id="timer">—</div>
        <div class="seg" id="timeSeg">
          <button data-v="0" class="on" id="tOff">Sin</button>
          <button data-v="60">1:00</button>
          <button data-v="90">1:30</button>
          <button data-v="120">2:00</button>
          <button data-v="180">3:00</button>
        </div>
      </div>
      <div class="muted" id="tTimerNote">El tiempo empieza cuando sale la letra.</div>
    </div>
    <div class="card">
      <label class="toggle"><input type="checkbox" id="easy" checked> <span id="tEasy">Quitar letras difíciles</span></label>
      <div class="muted" id="hardList"></div>
      <label class="toggle" style="margin-top:8px"><input type="checkbox" id="noRepeat" checked> <span id="tNoRep">No repetir letras</span></label>
    </div>
    <div class="card">
      <label id="tUsed">Letras usadas</label>
      <div class="used" id="used"></div>
      <div class="row" style="margin-top:10px"><button class="big ghost" id="resetBtn" style="font-size:16px;padding:8px 14px">↺ <span id="tReset">Empezar de nuevo</span></button></div>
    </div>
    <div class="card">
      <label id="tPrint">🖨 Hojas para imprimir</label>
      <div class="row">
        <a class="big ghost" style="font-size:16px;padding:8px 14px;text-decoration:none" href="imprimibles/Basta-Juego-de-Categorias-ES.pdf" target="_blank" rel="noopener">¡BASTA! (Español)</a>
        <a class="big ghost" style="font-size:16px;padding:8px 14px;text-decoration:none" href="imprimibles/STOP-Categories-Game-EN.pdf" target="_blank" rel="noopener">STOP! (English)</a>
      </div>
    </div>
  </div>
</main>
<div class="overlay" id="overlay"><div id="ovText">¡BASTA!<small id="ovSmall">¡Lápices arriba!</small></div></div>

<script>
const T = {
  es:{title:"Ruleta de Letras",spin:"🎡 Girar",hub:"GIRAR",stop:"✋ ¡BASTA!",ov:"¡BASTA!",ovs:"¡Lápices arriba! (toca para cerrar)",letter:"La letra es…",timer:"Temporizador",off:"Sin",tnote:"El tiempo empieza cuando sale la letra.",easy:"Quitar letras difíciles",norep:"No repetir letras",used:"Letras usadas",reset:"Empezar de nuevo",pr:"🖨 Hojas para imprimir",none:"Ninguna todavía",hard:"Se quitan: ",done:"¡Ya salieron todas las letras! Toca «Empezar de nuevo».",
      all:"ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split(""), hardL:["K","Ñ","Q","W","X","Y"]},
  en:{title:"Letter Wheel",spin:"🎡 Spin",hub:"SPIN",stop:"✋ STOP!",ov:"STOP!",ovs:"Pencils up! (tap to close)",letter:"The letter is…",timer:"Timer",off:"None",tnote:"The timer starts when the letter lands.",easy:"Remove hard letters",norep:"Don't repeat letters",used:"Letters used",reset:"Start over",pr:"🖨 Printable sheets",none:"None yet",hard:"Removed: ",done:"All letters used! Tap “Start over”.",
      all:"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""), hardL:["Q","U","V","X","Y","Z"]}
};
let lang="es", used=[], rot=0, spinning=false, secs=0, tLeft=0, tInt=null;
const $=id=>document.getElementById(id);
const COLORS=["#ff6b35","#2a9d8f","#f4b400","#e76f51","#457b9d","#8ab17d","#9b5de5","#f15bb5"];

function pool(){
  const t=T[lang]; let L=t.all.slice();
  if($('easy').checked) L=L.filter(x=>!t.hardL.includes(x));
  return L;
}
function available(){
  const p=pool();
  return $('noRepeat').checked ? p.filter(x=>!used.includes(x)) : p;
}
function draw(){
  const c=$('wheel'),g=c.getContext('2d'),L=available(),n=Math.max(L.length,1),R=490,cx=500,cy=500;
  g.clearRect(0,0,1000,1000);
  g.save(); g.translate(cx,cy); g.rotate(rot);
  const a=2*Math.PI/n;
  for(let i=0;i<n;i++){
    g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,i*a-Math.PI/2,(i+1)*a-Math.PI/2); g.closePath();
    g.fillStyle = L.length? COLORS[i%COLORS.length] : '#ddd'; g.fill();
    g.lineWidth=4; g.strokeStyle='#1d2433'; g.stroke();
    if(L.length){
      g.save(); g.rotate(i*a+a/2); g.fillStyle='#fff';
      g.font=`700 ${Math.min(80, 900/n+20)}px Fredoka, sans-serif`; g.textAlign='center'; g.textBaseline='middle';
      g.lineWidth=6; g.strokeStyle='rgba(29,36,51,.6)'; g.strokeText(L[i],0,-R*0.78); g.fillText(L[i],0,-R*0.78);
      g.restore();
    }
  }
  g.restore();
  g.beginPath(); g.arc(cx,cy,R,0,2*Math.PI); g.lineWidth=10; g.strokeStyle='#1d2433'; g.stroke();
}
function spin(){
  if(spinning) return;
  const L=available();
  if(!L.length){ $('letter').textContent='—'; $('tLetter').textContent=T[lang].done; return; }
  closeOverlay(); clearInterval(tInt); $('timer').textContent = secs? fmt(secs):'—';
  spinning=true; $('spinBtn').disabled=true;
  const n=L.length,a=2*Math.PI/n,pick=Math.floor(Math.random()*n);
  // pointer at top: segment i centered at angle i*a+a/2 from top, so rotate so that center is at 0
  const jitter=(Math.random()-.5)*a*0.6;
  const base=-(pick*a+a/2)+jitter;
  const cur=rot%(2*Math.PI);
  let target=base - cur; while(target>0) target-=2*Math.PI;
  const total=target - 2*Math.PI*(5+Math.floor(Math.random()*3));
  const start=rot,dur=4200,t0=performance.now();
  $('letter').textContent='?';
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4);
    rot=start+total*e; draw();
    if(p<1) requestAnimationFrame(step);
    else{
      spinning=false; $('spinBtn').disabled=false;
      const letter=L[pick]; $('letter').textContent=letter; $('tLetter').textContent=T[lang].letter;
      used.push(letter); renderUsed();
      if($('noRepeat').checked) setTimeout(draw,1600);
      startTimer();
    }
  };
  requestAnimationFrame(step);
}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')}
function startTimer(){
  clearInterval(tInt); if(!secs){ $('timer').textContent='—'; return; }
  tLeft=secs; $('timer').textContent=fmt(tLeft);
  tInt=setInterval(()=>{ tLeft--; $('timer').textContent=fmt(Math.max(tLeft,0)); if(tLeft<=0){clearInterval(tInt); openOverlay();} },1000);
}
function openOverlay(){ clearInterval(tInt); $('overlay').classList.add('on'); }
function closeOverlay(){ $('overlay').classList.remove('on'); }
function renderUsed(){
  $('used').innerHTML = used.length? used.map(x=>`<span>${x}</span>`).join('') : `<span class="muted" style="border:0;background:none">${T[lang].none}</span>`;
}
function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang;
  $('tTitle').textContent=t.title; $('spinBtn').textContent=t.spin; $('hub').textContent=t.hub; $('stopBtn').textContent=t.stop;
  $('ovText').firstChild.textContent=t.ov; $('ovSmall').textContent=t.ovs; $('tLetter').textContent=t.letter;
  $('tTimer').textContent=t.timer; $('tOff').textContent=t.off; $('tTimerNote').textContent=t.tnote;
  $('tEasy').textContent=t.easy; $('tNoRep').textContent=t.norep; $('tUsed').textContent=t.used; $('tReset').textContent=t.reset; $('tPrint').textContent=t.pr;
  $('hardList').textContent=t.hard+t.hardL.join(", ");
  renderUsed(); draw();
}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#langSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  lang=b.dataset.v; used=[]; $('letter').textContent='?'; applyLang();
});
document.querySelectorAll('#timeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#timeSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  secs=+b.dataset.v; clearInterval(tInt); $('timer').textContent= secs?fmt(secs):'—';
});
$('spinBtn').onclick=spin; $('hub').onclick=spin;
$('stopBtn').onclick=openOverlay; $('overlay').onclick=closeOverlay;
$('easy').onchange=draw; $('noRepeat').onchange=draw;
$('resetBtn').onclick=()=>{used=[];$('letter').textContent='?';$('tLetter').textContent=T[lang].letter;clearInterval(tInt);$('timer').textContent=secs?fmt(secs):'—';renderUsed();draw();};
if(new URLSearchParams(location.search).get('lang')==='en'){lang='en';document.querySelectorAll('#langSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v==='en'));}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
applyLang();
</script>
</body>
</html>
