<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de la maestra · ¡Encerrados en el museo!</title>
<style>
@page { size: letter portrait; margin: 0.5in; }
*{box-sizing:border-box}
body{margin:0;background:#eee;color:#000;font-family:system-ui,'Segoe UI',sans-serif}
.bar{position:sticky;top:0;background:#1b2740;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
.bar button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 16px;background:#f29f05;cursor:pointer}
.bar span{flex:1;min-width:240px;font-size:.95rem}
.page{max-width:8.5in;margin:18px auto;background:#fff;padding:0.5in;box-shadow:0 4px 18px #0003}
h1{margin:0 0 4px;font-family:Georgia,serif;font-size:24pt}
h2{margin:20px 0 6px;font-size:15pt;border-bottom:1px solid #000;padding-bottom:3px}
h3{margin:12px 0 4px;font-size:12pt}
p,li{font-size:11pt;line-height:1.45}
ol{margin:4px 0 0;padding-left:22px}
table{width:100%;border-collapse:collapse;margin-top:4px}
td,th{border:1px solid #000;padding:5px 7px;font-size:10.5pt;vertical-align:top;text-align:left}
th{font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){ .two{grid-template-columns:1fr} }
@media print{ body{background:#fff} .bar{display:none} .page{margin:0;box-shadow:none;padding:0;max-width:none} .two{grid-template-columns:1fr 1fr} section.lvl{break-inside:avoid-page} }
</style>
</head>
<body>
<div class="bar"><button onclick="print()">🖨 Imprimir hoja de la maestra</button><span>Solo para ti: tiene todas las respuestas. No la muestres en la TV.</span></div>
<div class="page" id="out"></div>
<script>
window.ESCAPE_GAMES = { museo: 'escape-contenido.js', biblioteca: 'escape-biblioteca.js', tienda: 'escape-tienda.js' };
window.ESCAPE_JUEGO = (function () { const j = new URLSearchParams(location.search).get('juego'); return window.ESCAPE_GAMES[j] ? j : 'museo'; })();
document.write('<script src="' + window.ESCAPE_GAMES[window.ESCAPE_JUEGO] + '"><\/script>');
</script>
<script>
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const E = window.ESCAPE;
const KIND = { mc: 'Opción', text: 'Escriben', tiles: 'Deletrean (fichas)', error: 'Error', code: 'Candado' };
const ans = r => r.t === 'mc' ? r.o[r.a] : r.t === 'text' ? r.ans[0] + (r.ans.length > 1 ? ' (también: ' + r.ans.slice(1).join(', ') + ')' : '') : r.t === 'tiles' ? r.word : r.t === 'code' ? r.code : (r.w + (r.fix ? ' → ' + r.fix.join(' / ') : ''));
document.title = 'Hoja de la maestra · ' + E.title;
const NC = Object.keys(window.ESCAPE_CARTELES).length;
const lvl = k => { const L = E.levels[k]; return `<section class="lvl"><h2>${h(L.name)} · guías: ${h(L.crew)}</h2>${L.salas.map(s => `<h3>${h(s.n)} ${s.cartel ? '· Cartel ' + s.cartel : '· sin cartel'} · letra <b>${h(s.letter)}</b></h3>
  <table><tr><th style="width:24%">Tipo</th><th>Reto</th><th style="width:28%">Respuesta</th></tr>${s.retos.map(r => `<tr><td>${KIND[r.t]}${r.lock ? ' 🔒' : ''}</td><td>${h(r.t === 'error' ? r.s : r.q)}</td><td><b>${h(ans(r))}</b></td></tr>`).join('')}</table>`).join('')}
  <h3>Puerta final</h3><p>Ordenan las letras ${L.salas.map(s => h(s.letter)).join(' · ')} → <b>${h(E.word)}</b> ${L.final.tiles ? '(con fichas)' : '(la escriben; acepta sin acentos)'}.</p></section>`; };
const MUSEO_INTRO = 'Escape room de unos 30 minutos para Middle School. MS1 juega con Los Vecinos (episodios 1–2); MS3 con El Club del Barrio MS2 (episodios 1–2). Repasa Día de Muertos (El altar de Mamá Toña, la Catrina, los alebrijes), personas especiales y países y capitales. El juego no tiene voz.';
const MUSEO_NOTES = ['Cartel 3 (altar): 1 papel picado · 2 sal · 3 cempasúchil · 4 foto · 5 pan de muerto · 6 agua · 7 velas · 8 calaverita de azúcar. Candado MS1 = agua, foto, velas → <b>647</b>. Candado MS3 = sal (purifica), cempasúchil (guía con su color y su olor), calaverita (tiene el nombre) → <b>238</b>.', 'Cartel 2: A Messi · B Lamine Yamal · C Lin-Manuel Miranda · D Diego Rivera · E José Guadalupe Posada · F Pedro Linares.', 'Cierre sugerido (5 min): «¿Por qué la palabra secreta es RAÍZ? ¿Cuáles son tus raíces?»'];
const nSalas = Object.values(E.levels)[0].salas.length, word = E.word;
document.getElementById('out').innerHTML = `<h1>${h(E.title)} · Hoja de la maestra</h1>
<p>${h(E.teacherIntro || MUSEO_INTRO)}</p>
<h2>Antes de la clase</h2>
<ol><li>Imprime los ${NC} carteles (una copia de cada uno) y pégalos en lugares separados del salón.</li>
<li>Prepara una tableta por equipo (2–3 estudiantes). Abre el enlace o escanea el QR de su grupo (${Object.values(E.levels).map(x => h(x.name)).join(' o ')}) desde Herramientas → 🔐 Escape room.</li>
<li>Opcional: pon el plano o el reloj de un equipo en la TV.</li></ol>
<h2>Cómo se juega</h2>
<ol><li>Escriben el nombre del equipo. El reloj empieza con la historia: el grupo queda encerrado.</li>
<li>Hay ${nSalas} salas y pueden ir en cualquier orden (así no van todos al mismo cartel). Cada sala tiene 4 retos: el último es el candado de la sala. Al terminar, ganan una letra.</li>
<li>${NC} salas usan un cartel; las otras son de memoria (la unidad y los episodios que leyeron).</li>
<li>Si fallan, aparece el botón 💡 Pista. El juego cuenta las pistas y el tiempo, pero no guarda notas ni manda datos a ningún lado.</li>
<li>Con las ${nSalas} letras abren la puerta: <b>${h(word)}</b>. Al final ven un certificado con su tiempo, sus pistas y un código secreto para enseñártelo.</li></ol>
<p><b>Tipos de reto:</b> pregunta de opción, ¿qué le falta a esta oración?, encuentra el error (y escriben la palabra correcta), deletrea la palabra y candado de números con el cartel.</p>
<div class="two">${Object.keys(E.levels).map(lvl).join('')}</div>
<h2>Datos que usan los carteles</h2>
${(E.keyNotes || MUSEO_NOTES).map(x => `<p>${x}</p>`).join('')}`;
</script>
</body>
</html>
