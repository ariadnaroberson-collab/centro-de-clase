    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-size:.62rem; text-align:center; color:var(--gold); letter-spacing:.5px;
    background:var(--navy); line-height:1.1; padding:4px;}
  h1{font-size:2.1rem; margin:6px 0 2px; text-align:center;}
  .sub{font-style:italic; color:var(--gold); font-size:.95rem; margin-bottom:14px; text-align:center;}
  .scorebar{font-size:1rem; margin-bottom:14px;}
  .card{background:var(--parchment); color:var(--navy); border:3px double var(--gold); border-radius:6px;
    padding:26px; max-width:640px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .prompt{font-size:1.25rem; margin-bottom:18px; text-align:center;}
  .step{background:var(--navy); color:var(--parchment); border:1px solid var(--gold); border-radius:6px; padding:14px 16px;
    margin-bottom:10px; display:flex; align-items:center; gap:12px; font-size:1.02rem; font-weight:bold;}
  .step.correct{background:var(--mint); border-color:var(--mint);}
  .step.wrong{background:var(--coral); border-color:var(--coral);}
  .num{background:var(--gold); color:var(--navy); border-radius:50%; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .txt{flex:1;}
  .arrows{display:flex; flex-direction:column; gap:2px;}
  .arrows button{background:var(--parchment); color:var(--navy); border:1px solid var(--gold);
    border-radius:5px; width:28px; height:24px; cursor:pointer; font-size:.8rem;}
  .actions{text-align:center; margin-top:18px;}
  .btn{background:var(--gold); color:var(--navy); border:none; border-radius:6px;
    padding:12px 26px; font-size:1.05rem; font-weight:bold; cursor:pointer; margin:0 6px; font-family:Georgia,serif;}
  .btn.outline{background:var(--navy); color:var(--parchment); border:1px solid var(--gold);}
  .end{display:none; text-align:center;}
  .end h2{font-size:2rem;}
  .unitBtn{display:block; width:100%; text-align:left; background:var(--navy); color:var(--parchment);
    border:1px solid var(--gold); border-radius:6px; padding:16px 18px; margin-bottom:12px; font-size:1.1rem;
    font-weight:bold; cursor:pointer; font-family:Georgia,serif;}
  .unitBtn small{display:block; font-weight:normal; font-style:italic; font-size:.8rem; margin-top:4px; opacity:.8;}
</style>
</head>

  <h1>🔢 En Orden</h1>

  <div class="card" id="gameCard" style="display:none;">

    <div id="steps"></div>
    <div class="actions">

let currentUnit=null, idx=0, score=0, order=[];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function showPicker(){
  document.getElementById('pickerCard').style.display='block';
  document.getElementById('scorebar').style.display='none';
  document.getElementById('gameCard').style.display='none';
  document.getElementById('endCard').style.display='none';
  const list = document.getElementById('unitList');
  list.innerHTML='';
  Object.entries(CONFIG.units).forEach(([key, unit])=>{
    const btn = document.createElement('button');
    btn.className='unitBtn';
    btn.innerHTML = `${unit.label}<small>${unit.sets.length} series</small>`;
    btn.onclick = ()=>startUnit(key);
    list.appendChild(btn);
  });
}

function startUnit(key){
  currentUnit = CONFIG.units[key];
  idx=0; score=0;
  document.getElementById('pickerCard').style.display='none';
  document.getElementById('scorebar').style.display='block';
  document.getElementById('gameCard').style.display='block';
  document.getElementById('endCard').style.display='none';
  document.getElementById('setTotal').textContent = currentUnit.sets.length;
  document.getElementById('score').textContent = 0;
  loadSet();
}

function loadSet(){
  const s = currentUnit.sets[idx];
  document.getElementById('setNum').textContent = idx+1;
  document.getElementById('prompt').textContent = s.prompt;
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('checkBtn').style.display='inline-block';
  order = shuffle(s.steps);
  render();
}

function render(){
  const box = document.getElementById('steps');
  box.innerHTML='';
  order.forEach((txt, i)=>{
    const div = document.createElement('div');
    div.className='step';
    div.innerHTML = `<div class="num">${i+1}</div><div class="txt">${txt}</div>
      <div class="arrows">
        <button data-dir="up" data-i="${i}">▲</button>
        <button data-dir="down" data-i="${i}">▼</button>
      </div>`;
    box.appendChild(div);
  });
  box.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i;
      const dir = b.dataset.dir;
      const j = dir==='up' ? i-1 : i+1;
      if(j<0 || j>=order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      render();
    };
  });
}

document.getElementById('checkBtn').onclick = ()=>{
  const correct = currentUnit.sets[idx].steps;
  let allRight = true;
  document.querySelectorAll('.step').forEach((div, i)=>{
    if(order[i]===correct[i]){ div.classList.add('correct'); }
    else { div.classList.add('wrong'); allRight=false; }
  });
  if(allRight) score++;
  document.getElementById('score').textContent = score;
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
};

document.getElementById('nextBtn').onclick = ()=>{
  idx++;
  if(idx < currentUnit.sets.length){ loadSet(); }
  else {
    document.getElementById('gameCard').style.display='none';
    document.getElementById('scorebar').style.display='none';
    document.getElementById('endCard').style.display='block';
    document.getElementById('finalScore').textContent = `Puntaje Final: ${score} / ${currentUnit.sets.length}`;
  }
};
document.getElementById('restartBtn').onclick = ()=>{
  idx=0; score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('gameCard').style.display='block';
  document.getElementById('scorebar').style.display='block';
  document.getElementById('endCard').style.display='none';
  loadSet();
};
document.getElementById('switchBtn').onclick = showPicker;

showPicker();
</script>
