<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Repaso de Dominio — Cuentopolis</title>
<style>
  :root{
    --navy:#0B2545; --gold:#C9A961; --parchment:#F6EFE0; --parchment-dark:#EDE2C8;
    --forest:#2F6B4F; --purple:#5B3A82; --coral:#C4544A; --mint:#3F8F63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--navy);
    background-image: radial-gradient(circle at 20% 20%, rgba(201,169,97,.08), transparent 40%),
                       radial-gradient(circle at 80% 80%, rgba(201,169,97,.06), transparent 40%);
    font-family:Georgia, 'Times New Roman', serif; color:var(--parchment);
    display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  .badge{position:fixed; bottom:16px; right:18px; width:64px; height:64px; border-radius:50%;
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-size:.62rem; text-align:center; color:var(--gold); font-family:Georgia,serif; letter-spacing:.5px;
    background:var(--navy); line-height:1.1; padding:4px;}
  h1{font-size:2.1rem; margin:6px 0 2px; letter-spacing:.5px; text-align:center;}
  .sub{font-family:Georgia,serif; font-style:italic; color:var(--gold); font-size:.95rem; margin-bottom:18px; text-align:center;}
  .scorebar{font-family:Georgia,serif; font-size:1rem; margin-bottom:16px;}
  .card{
    background:var(--parchment); color:var(--navy); border:3px double var(--gold); border-radius:6px;
    padding:26px; max-width:640px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:820px; width:100%;}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}
  .tile{
    background:var(--navy); color:var(--parchment); border:2px solid var(--gold); border-radius:6px;
    min-height:100px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:10px; font-size:.95rem; cursor:pointer; font-weight:bold; user-select:none;
  }
  .tile .back{font-size:1.8rem; color:var(--gold);}
  .tile.flipped{background:var(--parchment-dark); color:var(--navy); border-color:var(--navy);}
  .tile.matched{background:var(--mint); color:#fff; border-color:var(--mint); opacity:.9; cursor:default;}
  .end{display:none; text-align:center; margin-top:20px;}
  .end h2{font-size:2rem;}
  .btn{background:var(--gold); color:var(--navy); border:none; border-radius:6px;
    padding:12px 26px; font-size:1.05rem; font-weight:bold; cursor:pointer; margin-top:14px; margin-right:8px;
    font-family:Georgia,serif;}
  .btn.outline{background:var(--navy); color:var(--parchment); border:1px solid var(--gold);}
  .unitBtn{
    display:block; width:100%; text-align:left; background:var(--navy); color:var(--parchment);
    border:1px solid var(--gold); border-radius:6px; padding:16px 18px; margin-bottom:12px; font-size:1.1rem;
    font-weight:bold; cursor:pointer; font-family:Georgia,serif;
  }
  .unitBtn small{display:block; font-weight:normal; font-style:italic; font-size:.8rem; margin-top:4px; opacity:.8;}
  .mode-tag{display:inline-block; font-size:.7rem; font-family:Georgia,serif; padding:2px 8px; border-radius:10px;
    margin-left:8px; vertical-align:middle;}
  .mode-interpretive{background:var(--navy); color:#fff;}
  .mode-interpersonal{background:var(--forest); color:#fff;}
  .mode-presentational{background:var(--purple); color:#fff;}
</style>
</head>
<body>
  <h1>📖 Repaso de Dominio</h1>
  <div class="sub">Mastery Check — Voltea dos tarjetas para encontrar la pareja</div>

  <div class="card" id="pickerCard">
    <p style="font-size:1.2rem; margin-bottom:16px;">Elige una unidad para practicar:</p>
    <div id="unitList"></div>
  </div>

  <div class="scorebar" id="scorebar" style="display:none;">Intentos: <span id="moves">0</span> &nbsp;|&nbsp; Parejas: <span id="matches">0</span> / <span id="total"></span></div>

  <div class="grid" id="grid" style="display:none;"></div>

  <div class="end" id="endCard">
    <h2>🎉 ¡Completado!</h2>
    <p id="finalStats"></p>
    <button class="btn" id="restartBtn">Jugar de Nuevo</button>
    <button class="btn outline" id="switchBtn">Elegir Otra Unidad</button>
  </div>

  <div class="badge">CUENTO<br>POLIS</div>

<script>
/* =========================================================
   AÑADIR UNA NUEVA UNIDAD: copia uno de los bloques dentro de
   `units` y dale una nueva clave. El enlace de este juego NUNCA
   cambia — solo hay que volver a subir este mismo archivo con
   la nueva unidad añadida.

   This is a DEMO unit with placeholder content — swap in real
   vocabulary/concepts from an actual Cuentopolis title/CI lesson
   before using with students. Each pair can optionally carry a
   `mode` tag (interpretive / interpersonal / presentational) to
   mirror the ACTFL assessment-mode color coding.
   ========================================================= */
const CONFIG = {
  units: {
    "demo-unit": {
      label: "DEMO — reemplazar con contenido real de una unidad",
      pairs: [
        {term:"el bosque", def:"lugar con muchos árboles donde ocurre la aventura", mode:"interpretive"},
        {term:"la valentía", def:"tener el coraje de actuar a pesar del miedo", mode:"interpretive"},
        {term:"preguntar", def:"pedir información a otra persona", mode:"interpersonal"},
        {term:"responder", def:"contestar a una pregunta o situación", mode:"interpersonal"},
        {term:"describir", def:"explicar cómo es algo o alguien con detalles", mode:"presentational"},
        {term:"narrar", def:"contar una historia en orden", mode:"presentational"}
      ]
    },
    "guardianes-ep1": {
      label: "Guardianes de Chiquibul — Ep. 1: ¡Hola, Chica!",
      pairs: [
        {term:"la misión", def:"un trabajo especial e importante que alguien te da", mode:"interpretive"},
        {term:"estar nervioso/a", def:"sentir un poco de miedo o preocupación cuando algo es nuevo", mode:"interpretive"},
        {term:"¿Cómo te llamas?", def:"pregunta para saber el nombre de alguien", mode:"interpersonal"},
        {term:"¿De dónde eres?", def:"pregunta para saber el origen de alguien", mode:"interpersonal"},
        {term:"Me llamo...", def:"forma de decir tu nombre a alguien nuevo", mode:"presentational"},
        {term:"dar la bienvenida", def:"recibir a alguien nuevo con calidez", mode:"presentational"}
      ]
    },
    "guardianes-ep2": {
      label: "Guardianes de Chiquibul — Ep. 2: El Gran Árbol",
      pairs: [
        {term:"la Gran Ceiba", def:"el árbol más antiguo de la selva de Chiquibul", mode:"interpretive"},
        {term:"el barro", def:"tierra mojada", mode:"interpretive"},
        {term:"orgulloso/a", def:"contento consigo mismo por algo que hizo", mode:"interpretive"},
        {term:"asentir", def:"decir que sí con la cabeza", mode:"interpretive"},
        {term:"Busquen un color en la naturaleza.", def:"instrucción que da Don Pico para la misión del día", mode:"interpersonal"},
        {term:"cada color tiene un lugar", def:"idea de que la diversidad hace bella a la selva", mode:"presentational"}
      ]
    },
    "guardianes-ep3": {
      label: "Guardianes de Chiquibul — Ep. 3: Un amigo nuevo",
      pairs: [
        {term:"la mochila", def:"una bolsa para llevar cosas", mode:"interpretive"},
        {term:"la vergüenza", def:"un sentimiento de timidez o pena", mode:"interpretive"},
        {term:"el nudo (en la garganta)", def:"una sensación de tristeza", mode:"interpretive"},
        {term:"sincero/a", def:"que dice la verdad, sin esconder nada", mode:"interpretive"},
        {term:"Me llamo Toño. Mucho gusto.", def:"manera de presentarse a alguien nuevo", mode:"interpersonal"},
        {term:"Yo tenía miedo de...", def:"forma de compartir un sentimiento personal con el grupo", mode:"presentational"}
      ]
    },
    "guardianes-ep4": {
      label: "Guardianes de Chiquibul — Ep. 4: ¿Dónde está Mora?",
      pairs: [
        {term:"las plumas", def:"cubren el cuerpo de un pájaro", mode:"interpretive"},
        {term:"el sendero", def:"un camino pequeño en la selva", mode:"interpretive"},
        {term:"la orquídea", def:"una flor especial y delicada", mode:"interpretive"},
        {term:"débil", def:"que no tiene mucha fuerza", mode:"interpretive"},
        {term:"¿Buscan a alguien?", def:"pregunta que hace Luna para ofrecer ayuda", mode:"interpersonal"},
        {term:"Me llamo Luna. Llego de Yucatán para visitar a mis abuelos.", def:"manera de presentarse y decir de dónde vienes", mode:"presentational"}
      ]
    }
  }
};
/* ========================================================= */

let currentUnit=null, cards=[], flipped=[], matchedCount=0, moves=0, lock=false;
const modeLabel = {interpretive:"Interpretativo", interpersonal:"Interpersonal", presentational:"Presentacional"};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function showPicker(){
  document.getElementById('pickerCard').style.display='block';
  document.getElementById('scorebar').style.display='none';
  document.getElementById('grid').style.display='none';
  document.getElementById('endCard').style.display='none';
  const list = document.getElementById('unitList');
  list.innerHTML='';
  Object.entries(CONFIG.units).forEach(([key, unit])=>{
    const btn = document.createElement('button');
    btn.className='unitBtn';
    btn.innerHTML = `${unit.label}<small>${unit.pairs.length} parejas</small>`;
    btn.onclick = ()=>startUnit(key);
    list.appendChild(btn);
  });
}

function buildDeck(pairs){
  let deck=[];
  pairs.forEach((p,i)=>{
    deck.push({pairId:i, label:p.term, type:'term', mode:p.mode});
    deck.push({pairId:i, label:p.def, type:'def', mode:p.mode});
  });
  return shuffle(deck);
}

function startUnit(key){
  currentUnit = CONFIG.units[key];
  cards = buildDeck(currentUnit.pairs);
  flipped=[]; matchedCount=0; moves=0; lock=false;
  document.getElementById('moves').textContent=0;
  document.getElementById('matches').textContent=0;
  document.getElementById('total').textContent=currentUnit.pairs.length;
  document.getElementById('pickerCard').style.display='none';
  document.getElementById('scorebar').style.display='block';
  document.getElementById('grid').style.display='grid';
  document.getElementById('endCard').style.display='none';
  render();
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  cards.forEach((c, i)=>{
    const div = document.createElement('div');
    div.className='tile' + (c.state==='flipped'?' flipped':'') + (c.state==='matched'?' matched':'');
    const tag = c.state ? `<span class="mode-tag mode-${c.mode}">${modeLabel[c.mode]||''}</span>` : '';
    div.innerHTML = c.state ? `${c.label}${c.mode?('<br>'+tag):''}` : '<span class="back">?</span>';
    div.onclick = ()=>flipCard(i);
    grid.appendChild(div);
  });
}

function flipCard(i){
  if(lock) return;
  const c = cards[i];
  if(c.state) return;
  c.state='flipped';
  flipped.push(i);
  render();
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent = moves;
    lock=true;
    const [a,b] = flipped;
    if(cards[a].pairId===cards[b].pairId && cards[a].type!==cards[b].type){
      cards[a].state='matched'; cards[b].state='matched';
      matchedCount++;
      document.getElementById('matches').textContent = matchedCount;
      flipped=[]; lock=false; render();
      if(matchedCount===currentUnit.pairs.length){
        setTimeout(()=>{
          document.getElementById('grid').style.display='none';
          document.getElementById('scorebar').style.display='none';
          document.getElementById('endCard').style.display='block';
          document.getElementById('finalStats').textContent = `¡Resuelto en ${moves} intentos!`;
        },300);
      }
    } else {
      setTimeout(()=>{
        cards[a].state=null; cards[b].state=null;
        flipped=[]; lock=false; render();
      },800);
    }
  }
}

document.getElementById('restartBtn').onclick = ()=>{
  const key = Object.keys(CONFIG.units).find(k=>CONFIG.units[k]===currentUnit);
  startUnit(key);
};
document.getElementById('switchBtn').onclick = showPicker;

showPicker();
</script>
</body>
</html>
